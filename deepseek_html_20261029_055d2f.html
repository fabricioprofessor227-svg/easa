<script>
    (function(){
        const pageContents = [
            // Página 1 – Capa
            `<div class="capa">
                <h1>📘 Módulo 5B2 · Parte 2</h1>
                <h2>Data Buses e Fibra Ótica<br>
                ARINC 429 · ARINC 629 · MIL-STD-1553 · AFDX · Princípios e Aplicações de Fibra Ótica</h2>
                <p>Material de Estudo Resumido</p>
            </div>`,

            // Página 2 – Índice
            `<div class="text-container" style="max-width:100%;">
                <h3>📌 ÍNDICE DA PARTE 2</h3>
                <ol>
                    <li>Introdução aos Data Buses – Pág. 3</li>
                    <li>ARINC 429: O Padrão Mais Comum – Pág. 4</li>
                    <li>ARINC 629: O Barramento do Boeing 777 – Pág. 5</li>
                    <li>MIL-STD-1553: O Padrão Militar – Pág. 6</li>
                    <li>Ethernet e AFDX (Avionics Full-Duplex Switched Ethernet) – Pág. 7</li>
                    <li>Fibra Ótica: Introdução e Vantagens – Pág. 8</li>
                    <li>Princípios Físicos da Fibra Ótica – Pág. 9</li>
                    <li>Tipos de Fibra: Monomodo vs Multimodo – Pág. 10</li>
                    <li>Conectores e Terminais de Fibra Ótica – Pág. 11</li>
                    <li>Aplicações em Aeronaves (A380 e B787) – Pág. 12</li>
                    <li>Resumo Comparativo dos Data Buses – Pág. 13</li>
                    <li>Exercícios de Fixação (12 Questões com Respostas) – Pág. 14</li>
                    <li>Continuação dos Exercícios – Pág. 15</li>
                    <li>Continuação dos Exercícios – Pág. 16</li>
                    <li>🎉 Parabéns (Fim da Parte 2) – Pág. 17</li>
                </ol>
            </div>`,

            // Página 3
            `<h3>1. Introdução aos Data Buses</h3>
            <p>Um <strong>data bus</strong> (barramento de dados) é o "caminho" pelo qual a informação digital viaja entre os diversos sistemas e computadores de uma aeronave. À medida que as aeronaves se tornaram mais complexas, a fiabilidade, o peso e a capacidade de transmissão de dados tornaram-se fatores críticos.</p>

            <h4>1.1 Por que usar Data Buses?</h4>
            <ul>
                <li><strong>Redução de peso:</strong> Em vez de um fio dedicado para cada sinal (fiação ponto-a-ponto), um único par trançado pode transportar centenas de parâmetros.</li>
                <li><strong>Redundância:</strong> Vários caminhos podem ser configurados para garantir que a falha de um barramento não comprometa o voo.</li>
                <li><strong>Padronização:</strong> Permite que equipamentos de diferentes fabricantes (LRUs) "falem a mesma língua".</li>
            </ul>

            <h4>1.2 Terminologia</h4>
            <ul>
                <li><strong>Protocolo:</strong> As regras de comunicação (como os dados são formatados, endereçados e sincronizados).</li>
                <li><strong>Simplex:</strong> Comunicação unidirecional.</li>
                <li><strong>Half-duplex:</strong> Comunicação nos dois sentidos, mas não ao mesmo tempo.</li>
                <li><strong>Full-duplex:</strong> Comunicação nos dois sentidos simultaneamente.</li>
                <li><strong>Single Source / Multiple Sink:</strong> Um transmissor para vários recetores.</li>
                <li><strong>Multiple Source / Multiple Sink:</strong> Vários transmissores e vários recetores no mesmo barramento.</li>
            </ul>

            <h4>1.3 Principais Protocolos na Aviação</h4>
            <ul>
                <li><strong>ARINC 429:</strong> O mais comum em aeronaves comerciais e executivas.</li>
                <li><strong>ARINC 629:</strong> Utilizado no Boeing 777.</li>
                <li><strong>MIL-STD-1553:</strong> Padrão militar, muito robusto e redundante.</li>
                <li><strong>AFDX:</strong> Baseado em Ethernet, utilizado em aeronaves modernas como A380 e B787.</li>
            </ul>`,

            // Página 4
            `<h3>2. ARINC 429: O Padrão Mais Comum</h3>
            <p>O ARINC 429 é o padrão de barramento de dados mais difundido na aviação comercial. Foi concebido para ser simples e altamente fiável.</p>

            <h4>2.1 Características Principais</h4>
            <ul>
                <li><strong>Transmissão Unidirecional (Simplex):</strong> Um transmissor envia para até 20 recetores no mesmo par de fios.</li>
                <li><strong>Palavra de 32 bits:</strong> Os dados são organizados em palavras de 32 bits.</li>
                <li><strong>Codificação BPRZ:</strong> Bipolar Return to Zero (Retorno a Zero Bipolar), com três estados: HIGH (+10V), NULL (0V) e LOW (-10V).</li>
                <li><strong>Taxa de Transmissão:</strong> 12.5 kbps (baixa velocidade) ou 100 kbps (alta velocidade).</li>
            </ul>

            <h4>2.2 Estrutura da Palavra ARINC 429</h4>
            <ul>
                <li><strong>Bits 1-8 (Label):</strong> Identifica o tipo de dado (ex: altitude, velocidade). É transmitido em octal.</li>
                <li><strong>Bits 9-10 (SDI):</strong> Source/Destination Identifier, para múltiplos recetores.</li>
                <li><strong>Bits 11-29 (Data):</strong> O valor numérico (BNR ou BCD).</li>
                <li><strong>Bits 30-31 (SSM):</strong> Sign/Status Matrix (indica validade, teste, falha, ou sinal positivo/negativo).</li>
                <li><strong>Bit 32 (Parity):</strong> Bit de paridade (geralmente ímpar) para deteção de erros.</li>
            </ul>

            <h4>2.3 Vantagens e Desvantagens</h4>
            <ul>
                <li><strong>Vantagem:</strong> Alta fiabilidade, simplicidade de implementação, amplamente suportado.</li>
                <li><strong>Desvantagem:</strong> Requer muitos pares de fios (devido à unidirecionalidade), limite de 20 recetores por transmissor, velocidade relativamente baixa para os padrões atuais.</li>
            </ul>`,

            // Página 5
            `<h3>3. ARINC 629: O Barramento do Boeing 777</h3>
            <p>Para superar as limitações do ARINC 429, foi desenvolvido o ARINC 629, um barramento de alta velocidade e bidirecional, utilizado no Boeing 777.</p>

            <h4>3.1 Características</h4>
            <ul>
                <li><strong>Half-duplex:</strong> Permite que vários terminais transmitam e recebam, mas apenas um transmite de cada vez.</li>
                <li><strong>Velocidade:</strong> 2 Mbps (muito mais rápido que o ARINC 429).</li>
                <li><strong>Capacidade:</strong> Até 120 terminais conectados ao mesmo par trançado não blindado.</li>
                <li><strong>Acoplamento Indutivo:</strong> Os LRUs conectam-se ao barramento através de acopladores indutivos (sem necessidade de cortar o cabo), aumentando a fiabilidade.</li>
            </ul>

            <h4>3.2 Protocolo e Modos</h4>
            <ul>
                <li><strong>Modo Periódico:</strong> Transmissão em intervalos regulares, usado para dados de voo críticos.</li>
                <li><strong>Modo Aperiódico:</strong> Transmissão acionada por eventos, usado para dados menos críticos.</li>
                <li><strong>Terminal Gap (TG):</strong> Cada terminal tem um tempo de "gap" único, que define a sua prioridade de transmissão.</li>
            </ul>
            <p>O ARINC 629 foi concebido para reduzir drasticamente a quantidade de cablagem no Boeing 777 em comparação com o 747, melhorando a eficiência de combustível.</p>`,

            // Página 6
            `<h3>4. MIL-STD-1553: O Padrão Militar</h3>
            <p>O MIL-STD-1553 é um padrão de barramento de dados militar, amplamente utilizado em aeronaves de combate (F-16, F-18) e também em algumas aeronaves comerciais e helicópteros.</p>

            <h4>4.1 Características</h4>
            <ul>
                <li><strong>Velocidade:</strong> 1 Mbps.</li>
                <li><strong>Palavras de 20 bits:</strong> 16 bits de dados + 4 bits de controlo.</li>
                <li><strong>Codificação:</strong> Manchester II bi-phase.</li>
                <li><strong>Topologia:</strong> Barramento duplo redundante (dual redundant) com cabos STP (Shielded Twisted Pair).</li>
                <li><strong>Controlo:</strong> Um <em>Bus Controller</em> (BC) gere a comunicação, enviando comandos para os <em>Remote Terminals</em> (RT).</li>
            </ul>

            <h4>4.2 Vantagens</h4>
            <ul>
                <li>Altamente robusto e resistente a interferências.</li>
                <li>Redundância integrada (caminho A e B).</li>
                <li>Deteção de erros incorporada.</li>
            </ul>
            <p>O ARINC 429 é geralmente encontrado em aeronaves comerciais, enquanto o MIL-STD-1553 é o padrão para aplicações militares onde a robustez e a integridade são críticas.</p>`,

            // Página 7
            `<h3>5. Ethernet e AFDX (Avionics Full-Duplex Switched Ethernet)</h3>
            <p>As aeronaves modernas, como o Airbus A380 e o Boeing 787, exigem larguras de banda muito superiores às oferecidas pelo ARINC 429 ou 629. A solução foi adaptar o padrão Ethernet (IEEE 802.3) para a aviação, criando o <strong>AFDX</strong> (ARINC 664).</p>

            <h4>5.1 Características do AFDX</h4>
            <ul>
                <li><strong>Full-duplex:</strong> Transmissão e recepção simultâneas.</li>
                <li><strong>Determinístico:</strong> Garante uma largura de banda específica e um tempo de latência máximo, essencial para sistemas críticos.</li>
                <li><strong>Virtual Links (VL):</strong> Caminhos lógicos dedicados que garantem a alocação de largura de banda.</li>
                <li><strong>BAG (Bandwidth Allocation Gap):</strong> O intervalo mínimo entre duas transmissões consecutivas de um VL.</li>
                <li><strong>Redundância:</strong> Transmissão simultânea em duas redes independentes (A e B).</li>
            </ul>

            <h4>5.2 Vantagens do AFDX</h4>
            <ul>
                <li>Redução drástica de cablagem (substitui centenas de barramentos ARINC 429).</li>
                <li>Altas velocidades (10/100 Mbps).</li>
                <li>Baseado em COTS (Commercial Off-The-Shelf), reduzindo custos.</li>
            </ul>`,

            // Página 8
            `<h3>6. Fibra Ótica: Introdução e Vantagens</h3>
            <p>A fibra ótica é uma tecnologia de transmissão de dados que utiliza luz em vez de eletricidade. É cada vez mais utilizada em aeronaves modernas para superar as limitações do cobre.</p>

            <h4>6.1 Vantagens da Fibra Ótica</h4>
            <ul>
                <li><strong>Largura de Banda:</strong> Capacidade muito superior à do cobre.</li>
                <li><strong>Imunidade a EMI/RFI:</strong> A luz não é afetada por interferências eletromagnéticas.</li>
                <li><strong>Isolamento Elétrico:</strong> Não há condução elétrica, eliminando riscos de curto-circuito e faíscas.</li>
                <li><strong>Redução de Peso:</strong> A fibra é muito mais leve que o cobre (ex: 4 kg/km).</li>
                <li><strong>Segurança:</strong> É muito difícil intercetar sinais óticos (não irradiam).</li>
                <li><strong>Ausência de Crosstalk:</strong> Não há interferência entre fibras adjacentes.</li>
            </ul>

            <h4>6.2 Desvantagens</h4>
            <ul>
                <li>Custo inicial mais elevado de componentes e instalação.</li>
                <li>Maior complexidade de manutenção (requer ferramentas e formação específicas).</li>
                <li>Maior sensibilidade a curvas apertadas (perda por microcurvatura).</li>
            </ul>`,

            // Página 9
            `<h3>7. Princípios Físicos da Fibra Ótica</h3>
            <p>A fibra ótica funciona com base no princípio da <strong>reflexão interna total</strong>. A luz é confinada no núcleo da fibra e guiada ao longo do seu comprimento.</p>

            <h4>7.1 Estrutura da Fibra</h4>
            <ul>
                <li><strong>Núcleo (Core):</strong> O centro da fibra, feito de vidro de alta pureza, onde a luz viaja. Tem um índice de refração (n1).</li>
                <li><strong>Revestimento (Cladding):</strong> Uma camada de vidro ou plástico que envolve o núcleo. Tem um índice de refração (n2) ligeiramente inferior ao do núcleo (n2 < n1).</li>
                <li><strong>Revestimento Protetor (Buffer/Coating):</strong> Uma camada plástica que protege a fibra de danos físicos e humidade.</li>
            </ul>

            <h4>7.2 Reflexão Interna Total</h4>
            <p>Quando a luz viaja do núcleo para o revestimento e o ângulo de incidência é maior que o <strong>ângulo crítico</strong>, a luz é totalmente refletida de volta para o núcleo. Isto permite que a luz percorra longas distâncias com perdas mínimas.</p>
            <p><em>Condição:</em> n1 > n2.</p>

            <h4>7.3 Atenuação e Dispersão</h4>
            <ul>
                <li><strong>Atenuação:</strong> Perda de potência ótica ao longo da fibra (absorção e dispersão).</li>
                <li><strong>Dispersão:</strong> O alargamento do pulso de luz à medida que viaja, limitando a largura de banda.</li>
                <li><strong>Janelas de Operação:</strong> 850 nm, 1300 nm e 1550 nm são as janelas de menor atenuação na fibra de sílica.</li>
            </ul>`,

            `<h3>8. Tipos de Fibra: Monomodo vs Multimodo</h3>
            <p>As fibras óticas classificam-se principalmente pelo número de modos (caminhos) que a luz pode percorrer dentro do núcleo.</p>

            <h4>8.1 Fibra Multimodo</h4>
            <ul>
                <li><strong>Núcleo Grande:</strong> 50 µm ou 62.5 µm.</li>
                <li><strong>Múltiplos Caminhos:</strong> A luz propaga-se por vários percursos, causando dispersão modal (os pulsos alargam-se).</li>
                <li><strong>Fonte de Luz:</strong> Geralmente LEDs (mais baratos).</li>
                <li><strong>Aplicações:</strong> Curtas distâncias, redes locais (LAN), sistemas de aeronaves (ex: A380 usa 62.5/125 µm).</li>
                <li><strong>Vantagem:</strong> Mais fácil de conectar e acoplar a fontes de luz.</li>

            <h4>8.2 Fibra Monomodo</h4>
            <ul>
                <li><strong>Núcleo Pequeno:</strong> 8-10 µm.</li>
                <li><strong>Um Único Caminho:</strong> Apenas o modo fundamental se propaga, eliminando a dispersão modal.</li>
                <li><strong>Fonte de Luz:</strong> Lasers (mais caros e potentes).</li>
                <li><strong>Aplicações:</strong> Longas distâncias, telecomunicações de alta velocidade.</li>
                <li><strong>Vantagem:</strong> Menor atenuação e maior largura de banda.</li>

            `<h3>9. Conectores e Terminais de Fibra Ótica</h3>
            <p>A conexão de fibras óticas requer precisão extrema para garantir o alinhamento do núcleo e minimizar as perdas.</p>

                <li><strong>LC (Lucent Connector):</strong> Conector pequeno (1.25mm), de alta densidade, comum em comunicações modernas.</li>
                <li><strong>Bicónico (Biconical):</strong> Utilizado em algumas aeronaves, com um design cónico para alinhamento.</li>
            </ul>

            <h4>9.2 Terminais (Termini)</h4>
            <p>Na aviação, o termo "termini" refere-se ao conjunto que fixa e alinha a fibra dentro do conector. No Boeing 787, todos os cabos de fibra ótica usam o mesmo tipo de termini.</p>

                const text = node.textContent;
                if (!text.trim()) return;
                if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;
                const fragment = document.createDocumentFragment();
                const parts = text.split(/(\s+)/);
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'speech-word';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function buildCharMapForSpans(spans) {
            const map = [];
            spans.forEach((span, idx) => {
                const len = span.textContent.length;
                for (let i = 0; i < len; i++) map.push(idx);
                if (idx < spans.length - 1) map.push(idx);
            });
            return map;
        }

        function buildCharMap() {
            wordSpans = Array.from(pageContent.querySelectorAll('.speech-word'));
            charIndexToSpanMap = buildCharMapForSpans(wordSpans);
        }

        function highlightWordSpan(spanIndex) {
            if (previousActiveSpan !== null) {
                const prevSpan = wordSpans[previousActiveSpan];
                if (prevSpan) {
                    prevSpan.classList.remove('active');
                    prevSpan.classList.remove('upcoming');
                }
            }
            if (spanIndex >= 0 && spanIndex < wordSpans.length) {
                const currentSpan = wordSpans[spanIndex];
                currentSpan.classList.add('active');
                currentSpan.classList.remove('upcoming');
                previousActiveSpan = spanIndex;
                currentSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function markUpcoming(spanIndex) {
            wordSpans.forEach(s => s.classList.remove('upcoming'));
            for (let i = 1; i <= 3; i++) {
                const nextIdx = spanIndex + i;
                if (nextIdx < wordSpans.length) {
                    wordSpans[nextIdx].classList.add('upcoming');
                }
            }
        }

        function clearAllWordHighlights() {
            wordSpans.forEach(s => {
                s.classList.remove('active');
                s.classList.remove('upcoming');
            });
            previousActiveSpan = null;
        }

        function syncHighlightFromCharIndex() {
            if (currentCharIndex >= charIndexToSpanMap.length) return;
            const spanIdx = charIndexToSpanMap[currentCharIndex];
            if (spanIdx !== undefined && spanIdx !== previousActiveSpan) {
                highlightWordSpan(spanIdx);
                markUpcoming(spanIdx);
            }
        }

        function highlightSelectionWord(spanIdx) {
            if (selectionPrevSpan !== null) {
                const prev = selectionWordSpans[selectionPrevSpan];
                if (prev) {
                    prev.classList.remove('active');
                    prev.classList.remove('upcoming');
                }
            }
            if (spanIdx >= 0 && spanIdx < selectionWordSpans.length) {
                const curr = selectionWordSpans[spanIdx];
                curr.classList.add('active');
                curr.classList.remove('upcoming');
                selectionPrevSpan = spanIdx;
                curr.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            selectionWordSpans.forEach((s, i) => {
                if (i !== spanIdx) s.classList.remove('upcoming');
            });
            for (let i = 1; i <= 3; i++) {
                const next = selectionWordSpans[spanIdx + i];
                if (next) next.classList.add('upcoming');
            }
        }

        function clearSelectionHighlights() {
            selectionWordSpans.forEach(s => {
                s.classList.remove('active');
                s.classList.remove('upcoming');
            });
            selectionPrevSpan = null;
        }

        function showPlayingUI() {
            speakBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            stopBtn.classList.remove('hidden');
            resumeBtn.classList.add('hidden');
        }

        function showPausedUI() {
            pauseBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
            resumeBtn.classList.remove('hidden');
            speakBtn.classList.add('hidden');
        }

        function showStoppedUI() {
            speakBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
        }

        function setSelectionBtnState(state) {
            lerSelecaoBtn.classList.remove('reading', 'paused');
            if (state === 'reading') {
                lerSelecaoBtn.textContent = '⏸️ Pausar';
                lerSelecaoBtn.title = 'Pausar leitura da seleção';
                lerSelecaoBtn.classList.add('reading');
            } else if (state === 'paused') {
                lerSelecaoBtn.textContent = '▶️ Retomar';
                lerSelecaoBtn.title = 'Retomar leitura da seleção';
                lerSelecaoBtn.classList.add('paused');
            } else {
                lerSelecaoBtn.textContent = '📖 Ler Seleção';
                lerSelecaoBtn.title = 'Ler somente o trecho selecionado';
            }
        }

        function startReading() {
            if (!synth) { alert('Seu navegador não suporta síntese de voz.'); return; }
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();

            if (isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
                return;
            }
            if (isSpeaking) { stopReading(); return; }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
            }
            buildCharMap();
            if (wordSpans.length === 0) return;

            const text = wordSpans.map(s => s.textContent).join(' ');
            currentUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) currentUtterance.voice = voice;
            currentUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            speechToken = token;
            currentCharIndex = 0;

            currentUtterance.onboundary = function(event) {
                if (speechToken !== token) return;
                if (event.name === 'word') {
                    currentCharIndex = event.charIndex;
                    syncHighlightFromCharIndex();
                }
            };
            currentUtterance.onstart = function() {
                if (speechToken !== token) return;
                isSpeaking = true;
                isPaused = false;
                showPlayingUI();
            };
            currentUtterance.onend = function() {
                if (speechToken !== token) return;
                resetSpeechState();
            };
            currentUtterance.onerror = function(e) {
                if (speechToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Speech error:', e.error);
                resetSpeechState();
            };

            synth.speak(currentUtterance);
        }

        function pauseReading() {
            if (synth && isSpeaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showPausedUI();
            }
        }

        function resumeReading() {
            if (synth && isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
            }
        }

        function stopReading() {
            if (synth) synth.cancel();
            resetSpeechState();
        }

        function resetSpeechState() {
            if (synth && synth.speaking) synth.cancel();
            if (currentUtterance) {
                currentUtterance.onboundary = null;
                currentUtterance.onstart = null;
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance = null;
            }
            isSpeaking = false;
            isPaused = false;
            speechToken = null;
            currentCharIndex = 0;
            clearAllWordHighlights();
            showStoppedUI();
        }

        function startSelectionReading() {
            if (!synth) { alert('Seu navegador não suporta síntese de voz.'); return; }
            if (isSpeaking || isPaused) stopReading();

            const range = getActiveSelectionRange();
            if (!range) {
                alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
                return;
            }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
                const newRange = getActiveSelectionRange();
                if (!newRange) {
                    alert('Selecione novamente o trecho desejado.');
                    return;
                }
                return startSelectionReadingWithRange(newRange);
            }

            startSelectionReadingWithRange(range);
        }

        function startSelectionReadingWithRange(range) {
            const spans = [];
            pageContent.querySelectorAll('.speech-word').forEach(span => {
                try {
                    if (range.intersectsNode(span)) spans.push(span);
                } catch(e) {}
            });

            if (spans.length === 0) {
                alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
                return;
            }

            selectionWordSpans = spans;
            selectionCharMap = buildCharMapForSpans(selectionWordSpans);
            clearSelectionHighlights();

            const text = spans.map(s => s.textContent).join(' ');
            selectionUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) selectionUtterance.voice = voice;
            selectionUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            selectionToken = token;

            selectionUtterance.onboundary = function(event) {
                if (selectionToken !== token) return;
                if (event.name === 'word') {
                    const charIdx = event.charIndex;
                    if (charIdx < selectionCharMap.length) {
                        const spanIdx = selectionCharMap[charIdx];
                        if (spanIdx !== undefined) highlightSelectionWord(spanIdx);
                    }
                }
            };
            selectionUtterance.onstart = function() {
                if (selectionToken !== token) return;
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
                stopBtn.classList.remove('hidden');
            };
            selectionUtterance.onend = function() {
                if (selectionToken !== token) return;
                resetSelectionState();
            };
            selectionUtterance.onerror = function(e) {
                if (selectionToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Selection speech error:', e.error);
                resetSelectionState();
            };

            synth.speak(selectionUtterance);
        }

        function toggleSelectionReading() {
            if (isReadingSelection) {
                synth.pause();
                isReadingSelection = false;
                isSelectionPaused = true;
                setSelectionBtnState('paused');
            } else if (isSelectionPaused) {
                synth.resume();
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
            } else {
                startSelectionReading();
            }
        }

        function stopSelectionReading() {
            if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
            resetSelectionState();
        }

        function resetSelectionState() {
            if (selectionUtterance) {
                selectionUtterance.onboundary = null;
                selectionUtterance.onstart = null;
                selectionUtterance.onend = null;
                selectionUtterance.onerror = null;
                selectionUtterance = null;
            }
            isReadingSelection = false;
            isSelectionPaused = false;
            selectionToken = null;
            clearSelectionHighlights();
            setSelectionBtnState('idle');
            stopBtn.classList.add('hidden');
        }

        function updateUI() {
            resetSpeechState();
            resetSelectionState();
            pageContent.innerHTML = pageContents[currentPage];
            tokenizeTextNodes(pageContent);
            lastSelectionRange = null;
            lastSelectionText = '';

            const num = currentPage + 1;
            pageXofY.textContent = `Página ${num} de ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);

            if (currentPage === totalPages - 1) {
                encerrarBtn.classList.remove('hidden');
            } else {
                encerrarBtn.classList.add('hidden');
            }

            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
