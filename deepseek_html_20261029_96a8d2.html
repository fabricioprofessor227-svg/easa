<script>
    (function(){
        const pageContents = [
            // Página 1 – Capa
            `<div class="capa">
                <h1>📘 Módulo 5B2 · Parte 4</h1>
                <h2>Ambiente Eletromagnético e ESD<br>
                EMI · EMC · HIRF · Proteção contra Raios · Descargas Eletrostáticas</h2>
                <p>Material de Estudo Resumido</p>
            </div>`,

            // Página 2 – Índice
            `<div class="text-container" style="max-width:100%;">
                <h3>📌 ÍNDICE DA PARTE 4</h3>
                <ol>
                    <li>Introdução ao Ambiente Eletromagnético (EMC vs EMI) – Pág. 3</li>
                    <li>Fontes de EMI (Internas e Externas) – Pág. 4</li>
                    <li>HIRF (High Intensity Radiated Fields) – Pág. 5</li>
                    <li>Efeitos do HIRF em Sistemas Digitais – Pág. 6</li>
                    <li>Métodos de Proteção contra EMI/HIRF – Pág. 7</li>
                    <li>Proteção contra Raios (Lightning) – Pág. 8</li>
                    <li>Inspeção e Proteção contra Raios – Pág. 9</li>
                    <li>Introdução ao ESD (Descarga Eletrostática) – Pág. 10</li>
                    <li>Modelos de Teste ESD (HBM, CDM, MM) – Pág. 11</li>
                    <li>Tipos de Falhas e Precauções ESD – Pág. 12</li>
                    <li>Manuseamento de PCBs e LRUs Sensíveis – Pág. 13</li>
                    <li>Outros Perigos Estáticos (Reabastecimento e PEDs) – Pág. 14</li>
                    <li>Exercícios de Fixação (12 Questões com Respostas) – Pág. 15</li>
                    <li>Continuação dos Exercícios – Pág. 16</li>
                    <li>🎉 Parabéns (Fim da Parte 4) – Pág. 17</li>
                </ol>
            </div>`,

            // Página 3
            `<h3>1. Introdução ao Ambiente Eletromagnético</h3>
            <p>A aviação moderna depende fortemente de sistemas eletrónicos. No entanto, esses sistemas operam num ambiente repleto de radiações eletromagnéticas, tanto geradas internamente pela própria aeronave quanto externamente por radares, emissoras de rádio e fenómenos naturais.</p>
            
            <h4>1.1 EMC (Electromagnetic Compatibility)</h4>
            <p>É a capacidade de um equipamento operar satisfatoriamente no seu ambiente eletromagnético, sem introduzir distúrbios intoleráveis a outros dispositivos nesse mesmo ambiente.</p>
            <ul>
                <li>Testes de EMC avaliam as <strong>emissões</strong> (o quanto o equipamento "polui" o ambiente) e a <strong>imunidade</strong> (o quanto ele resiste à poluição externa).</li>
                <li>Ensaios são feitos em câmaras anecoicas ou reverberantes.</li>
            </ul>

            <h4>1.2 EMI (Electromagnetic Interference)</h4>
            <p>É a interferência indesejada causada por radiação eletromagnética. Pode manifestar-se como estática em sistemas de áudio, "neve" em ecrãs CRT ou perda de dados.</p>
            <p>A EMI pode ser <strong>conduzida</strong> (viajando por cabos) ou <strong>radiada</strong> (viajando pelo ar).</p>`,

            // Página 4
            `<h3>2. Fontes de EMI</h3>
            
            <h4>2.1 Fontes Internas</h4>
            <p>São geradas pelos próprios equipamentos da aeronave:</p>
            <ul>
                <li><strong>Motores e Geradores:</strong> As faíscas (arcing) entre as escovas e o comutador geram picos de ruído.</li>
                <li><strong>Sistema de Ignição:</strong> Os magnetos e velas geram pulsos de alta energia.</li>
                <li><strong>Luzes Anti-Colisão:</strong> Pulsos de energia que podem induzir ruído.</li>
                <li><strong>Inversores e Fontes de Alimentação:</strong> A comutação de alta frequência gera ruído.</li>
            </ul>

            <h4>2.2 Fontes Externas</h4>
            <ul>
                <li><strong>Ruído Cósmico:</strong> Radiação proveniente do espaço (mais notável acima de 12 MHz).</li>
                <li><strong>Ruído Atmosférico:</strong> Descargas elétricas durante tempestades.</li>
                <li><strong>Eletricidade Estática (P-Static):</strong> O atrito da aeronave com partículas de ar, chuva ou granizo acumula carga na fuselagem. O "St. Elmo's Fire" é um exemplo de descarga corona. Os <em>static dischargers</em> (pássaros) nas pontas das asas servem para dissipar essa carga de forma controlada.</li>
                <li><strong>Transmissores Externos:</strong> Radares, estações de rádio e TV.</li>
            </ul>`,

            // Página 5
            `<h3>3. HIRF (High Intensity Radiated Fields)</h3>
            <p>O HIRF é um campo eletromagnético externo de alta intensidade (não ionizante) que pode causar efeitos adversos nos sistemas elétricos e eletrónicos da aeronave, afetando a segurança do voo.</p>
            
            <h4>3.1 Definição e Faixa de Frequência</h4>
            <ul>
                <li>Considera-se o espectro de <strong>10 kHz a 18 GHz</strong>.</li>
                <li>Inclui emissores intencionais licenciados (radares, comunicações, radiodifusão).</li>
                <li>Não inclui EMI gerada internamente (EMC) nem descargas eletrostáticas (ESD).</li>
            </ul>

            <h4>3.2 Características do Espectro</h4>
            <ul>
                <li><strong>Abaixo de 400 MHz:</strong> Predominam sistemas de comunicação e radiodifusão (rádio AM/FM, TV). As ondas são mais largas e os sinais contínuos.</li>
                <li><strong>Acima de 400 MHz:</strong> Predominam radares, sistemas de micro-ondas e satélites. Os feixes são muito estreitos e os picos de potência (pulsos) são extremamente altos.</li>
            </ul>`,

            // Página 6
            `<h3>4. Efeitos do HIRF em Sistemas Digitais</h3>
            <p>Os sinais de HIRF podem penetrar na aeronave através de janelas, radome (que é transparente ao radar) e fendas na fuselagem.</p>

            <h4>4.1 Acoplamento e Efeitos</h4>
            <ul>
                <li><strong>Acoplamento em Cabos:</strong> O campo eletromagnético induz correntes e tensões nos fios. Isso pode levar a picos de tensão que "enganam" os circuitos integrados.</li>
                <li><strong>Efeitos em Circuitos Digitais:</strong> Pulsos de HIRF podem ser retificados por diodos internos, criando um offset DC que altera o estado lógico (0 para 1 ou vice-versa), causando "upsets" (falhas momentâneas).</li>
                <li><strong>Efeitos em Circuitos Analógicos:</strong> São mais sensíveis (na ordem de 50 mV). Podem causar leituras erradas de sensores.</li>
                <li><strong>Efeitos em CRT:</strong> Pode causar desfoque ou apagão momentâneo do ecrã.</li>
            </ul>

            <h4>4.2 Importância da Blindagem</h4>
            <p>As janelas do cockpit são as principais "portas de entrada" para o HIRF, pois são aberturas na blindagem metálica. A fuselagem de alumínio oferece excelente blindagem, mas os compósitos exigem a incorporação de malhas metálicas para garantir a mesma proteção.</p>`,

            // Página 7
            `<h3>5. Métodos de Proteção contra EMI/HIRF</h3>
            
            <h4>5.1 Bonding (Ligação Elétrica)</h4>
            <p>Todos os equipamentos, bandejas de montagem e a estrutura da aeronave devem estar eletricamente ligados (bonded) para garantir um caminho de baixa impedância para o "terra". A resistência de bonding não deve exceder 0,05 ohms.</p>

            <h4>5.2 Screening (Blindagem)</h4>
            <ul>
                <li>Uso de cabos blindados (com trança de cobre ou alumínio).</li>
                <li>Os ecrãs dos cabos devem ser aterrados, muitas vezes numa só extremidade, para evitar <strong>ground loops</strong> (laços de terra) que atuam como antenas.</li>
                <li>Gaxetas (gaskets) condutoras nas tampas dos LRUs para garantir a continuidade elétrica.</li>
            </ul>

            <h4>5.3 Filtros</h4>
            <p>Filtros passa-baixo (capacitores) são colocados nas entradas e saídas dos LRUs para bloquear altas frequências, permitindo a passagem dos sinais de baixa frequência desejados.</p>

            <h4>5.4 Transparent Conductive Windows</h4>
            <p>As janelas do cockpit podem ter uma fina camada de óxido metálico que permite a visão, mas bloqueia a radiação eletromagnética.</p>`,

            // Página 8
            `<h3>6. Proteção contra Raios (Lightning)</h3>
            <p>Uma aeronave comercial é atingida por um raio, em média, uma vez por ano. A proteção visa garantir que a descarga passe pela estrutura externa e saia sem causar danos aos sistemas internos ou inflamar o combustível.</p>

            <h4>6.1 Zonas de Ataque (SAE ARP 5414)</h4>
            <ul>
                <li><strong>Zona 1:</strong> Áreas com alta probabilidade de ataque inicial (radome, pontas das asas, nacelles, ponta da cauda).</li>
                <li><strong>Zona 2:</strong> Áreas suscetíveis a serem varridas (swept stroke) pelo canal do raio após o ataque inicial (fuselagem média).</li>
                <li><strong>Zona 3:</strong> Áreas que raramente recebem o ataque direto, mas podem conduzir a corrente (partes internas, estrutura inferior).</li>
            </ul>

            <h4>6.2 Efeitos e Danos</h4>
            <ul>
                <li><strong>Estrutura Metálica:</strong> Furos, marcas de queimadura, derretimento, distorção.</li>
                <li><strong>Estrutura Compósita:</strong> Delaminação, queima da fibra, perfuração. Requer malhas metálicas (foil de cobre ou alumínio) e fitas de metal (diverter strips) na superfície para conduzir a corrente.</li>
                <li><strong>Sistemas:</strong> Pode causar magnetização de componentes, queima de fios e danos a LRUs.</li>
            </ul>`,

            // Página 9
            `<h3>7. Inspeção e Proteção contra Raios</h3>
            
            <h4>7.1 Após um Ataque</h4>
            <p>Se um raio atingir a aeronave, uma inspeção especial (Lightning Strike Conditional Inspection) deve ser realizada para encontrar os pontos de entrada e saída.</p>
            <ul>
                <li>Examinar Zona 1 e Zona 2 em busca de queimaduras, furos e danos em compósitos.</li>
                <li>Verificar os pára-raios (static dischargers) e fitas de bonding.</li>
                <li>Inspecionar as antenas e os radomes.</li>
                <li>Testar os sistemas de rádio, navegação e radar, caso haja suspeita de danos.</li>
            </ul>

            <h4>7.2 Proteção em Compósitos</h4>
            <ul>
                <li>O Boeing 787 utiliza uma malha de cobre ou alumínio na superfície da fuselagem de fibra de carbono para conduzir a corrente do raio.</li>
                <li>O radome tem <strong>diverter strips</strong> (tiras de metal) que atuam como para-raios, protegendo a antena de radar no seu interior.</li>
            </ul>`,

            // Página 10
            `<h3>8. Introdução ao ESD (Descarga Eletrostática)</h3>
            <p>A Descarga Eletrostática (ESD) é a transferência súbita de carga elétrica entre dois objetos com potenciais diferentes. É uma das principais causas de falhas em componentes eletrónicos durante a manutenção.</p>

            <h4>8.1 Efeito Triboelétrico</h4>
            <p>A carga estática é gerada quando dois materiais diferentes entram em contacto e são separados (atrito). O corpo humano pode acumular tensões de até 15.000 volts (ao andar sobre um tapete de náilon), o que é suficiente para destruir um circuito integrado.</p>

            <h4>8.2 Sensibilidade dos Dispositivos (ESDS)</h4>
            <p>Os dispositivos eletrónicos, especialmente os MOSFETs e circuitos CMOS, são extremamente sensíveis. Uma descarga invisível e indolor para o humano (ex: 100V) pode perfurar o óxido de silício de um chip e inutilizá-lo.</p>

            });
            for (let i = 1; i <= 3; i++) {
                const next = selectionWordSpans[spanIdx + i];
                if (next) next.classList.add('upcoming');
            }
        }

        function clearSelectionHighlights() {
            selectionWordSpans.forEach(s => {
                s.classList.remove('active');
                s.classList.remove('upcoming');
            });
            selectionPrevSpan = null;
        }

        function showPlayingUI() {
            speakBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            stopBtn.classList.remove('hidden');
            resumeBtn.classList.add('hidden');
        }

        function showPausedUI() {
            pauseBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
            resumeBtn.classList.remove('hidden');
            speakBtn.classList.add('hidden');
        }

        function showStoppedUI() {
            speakBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
        }

        function setSelectionBtnState(state) {
            lerSelecaoBtn.classList.remove('reading', 'paused');
            if (state === 'reading') {
                lerSelecaoBtn.textContent = '⏸️ Pausar';
                lerSelecaoBtn.title = 'Pausar leitura da seleção';
                lerSelecaoBtn.classList.add('reading');
            } else if (state === 'paused') {
                lerSelecaoBtn.textContent = '▶️ Retomar';
                lerSelecaoBtn.title = 'Retomar leitura da seleção';
                lerSelecaoBtn.classList.add('paused');
            } else {
                lerSelecaoBtn.textContent = '📖 Ler Seleção';
                lerSelecaoBtn.title = 'Ler somente o trecho selecionado';
            }
        }

        function startReading() {
            if (!synth) { alert('Seu navegador não suporta síntese de voz.'); return; }
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();

            if (isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
                return;
            }
            if (isSpeaking) { stopReading(); return; }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
            }
            buildCharMap();
            if (wordSpans.length === 0) return;

            const text = wordSpans.map(s => s.textContent).join(' ');
            currentUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) currentUtterance.voice = voice;
            currentUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            speechToken = token;
            currentCharIndex = 0;

            currentUtterance.onboundary = function(event) {
                if (speechToken !== token) return;
                if (event.name === 'word') {
                    currentCharIndex = event.charIndex;
                    syncHighlightFromCharIndex();
                }
            };
            currentUtterance.onstart = function() {
                if (speechToken !== token) return;
                isSpeaking = true;
                isPaused = false;
                showPlayingUI();
            };
            currentUtterance.onend = function() {
                if (speechToken !== token) return;
                resetSpeechState();
            };
            currentUtterance.onerror = function(e) {
                if (speechToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Speech error:', e.error);
                resetSpeechState();
            };

            synth.speak(currentUtterance);
        }

        function pauseReading() {
            if (synth && isSpeaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showPausedUI();
            }
        }

        function resumeReading() {
            if (synth && isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
            }
        }

        function stopReading() {
            if (synth) synth.cancel();
            resetSpeechState();
        }

        function resetSpeechState() {
            if (synth && synth.speaking) synth.cancel();
            if (currentUtterance) {
                currentUtterance.onboundary = null;
                currentUtterance.onstart = null;
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance = null;
            }
            isSpeaking = false;
            isPaused = false;
            speechToken = null;
            currentCharIndex = 0;
            clearAllWordHighlights();
            showStoppedUI();
        }

        function startSelectionReading() {
            if (!synth) { alert('Seu navegador não suporta síntese de voz.'); return; }
            if (isSpeaking || isPaused) stopReading();

            const range = getActiveSelectionRange();
            if (!range) {
                alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
                return;
            }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
                const newRange = getActiveSelectionRange();
                if (!newRange) {
                    alert('Selecione novamente o trecho desejado.');
                    return;
                }
                return startSelectionReadingWithRange(newRange);
            }

            startSelectionReadingWithRange(range);
        }

        function startSelectionReadingWithRange(range) {
            const spans = [];
            pageContent.querySelectorAll('.speech-word').forEach(span => {
                try {
                    if (range.intersectsNode(span)) spans.push(span);
                } catch(e) {}
            });

            if (spans.length === 0) {
                alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
                return;
            }

            selectionWordSpans = spans;
            selectionCharMap = buildCharMapForSpans(selectionWordSpans);
            clearSelectionHighlights();

            const text = spans.map(s => s.textContent).join(' ');
            selectionUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) selectionUtterance.voice = voice;
            selectionUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            selectionToken = token;

            selectionUtterance.onboundary = function(event) {
                if (selectionToken !== token) return;
                if (event.name === 'word') {
                    const charIdx = event.charIndex;
                    if (charIdx < selectionCharMap.length) {
                        const spanIdx = selectionCharMap[charIdx];
                        if (spanIdx !== undefined) highlightSelectionWord(spanIdx);
                    }
                }
            };
            selectionUtterance.onstart = function() {
                if (selectionToken !== token) return;
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
                stopBtn.classList.remove('hidden');
            };
            selectionUtterance.onend = function() {
                if (selectionToken !== token) return;
                resetSelectionState();
            };
            selectionUtterance.onerror = function(e) {
                if (selectionToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Selection speech error:', e.error);
                resetSelectionState();
            };

            synth.speak(selectionUtterance);
        }

        function toggleSelectionReading() {
            if (isReadingSelection) {
                synth.pause();
                isReadingSelection = false;
                isSelectionPaused = true;
                setSelectionBtnState('paused');
            } else if (isSelectionPaused) {
                synth.resume();
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
            } else {
                startSelectionReading();
            }
        }

        function stopSelectionReading() {
            if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
            resetSelectionState();
        }

        function resetSelectionState() {
            if (selectionUtterance) {
                selectionUtterance.onboundary = null;
                selectionUtterance.onstart = null;
                selectionUtterance.onend = null;
                selectionUtterance.onerror = null;
                selectionUtterance = null;
            }
            isReadingSelection = false;
            isSelectionPaused = false;
            selectionToken = null;
            clearSelectionHighlights();
            setSelectionBtnState('idle');
            stopBtn.classList.add('hidden');
        }

        function updateUI() {
            resetSpeechState();
            resetSelectionState();
            pageContent.innerHTML = pageContents[currentPage];
            tokenizeTextNodes(pageContent);
            lastSelectionRange = null;
            lastSelectionText = '';

            const num = currentPage + 1;
            pageXofY.textContent = `Página ${num} de ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);

            if (currentPage === totalPages - 1) {
                encerrarBtn.classList.remove('hidden');
            } else {
                encerrarBtn.classList.add('hidden');
            }

            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
