                <h1>📘 Module 5B2 · Part 1</h1>

                Numbering Systems · Data Conversion · Logic Circuits</h2>

            // Page 2 – Index
            `<div class="text-container" style="max-width:100%;">
                <h3>📌 PART 1 INDEX</h3>
                <ol>
                    <li>Numbering Systems: Introduction – Page 3</li>

                    <li>Practice Exercises (12 Questions) – Page 17</li>

            </div>`,

            // Page 3
            `<h3>1. Numbering Systems: Introduction</h3>
            <p>Numbering systems are fundamental to understanding computers and digital electronics. Each system has a <strong>base</strong> (or radix), which defines the number of distinct symbols used to represent values.</p>
            
            <h4>1.1 Why Binary?</h4>
            <p>Electronic circuits operate with two distinct voltage states: <strong>HIGH</strong> and <strong>LOW</strong>. These two states are represented by the digits <strong>1</strong> and <strong>0</strong>, respectively. This is the binary system (base 2), the native language of computers.</p>
            <ul>
                <li><strong>Positive Logic:</strong> HIGH = 1, LOW = 0.</li>
                <li><strong>Negative Logic:</strong> HIGH = 0, LOW = 1.</li>
            </ul>
            <p>The exact voltage is not critical. In a 5V logic system, a voltage of 3.6V or 4.3V is interpreted as binary 1.</p>

            <h4>1.2 Positional Notation</h4>
            <p>In positional systems, the value of a digit depends on its position. The rightmost digit is the <strong>Least Significant Digit (LSD)</strong> and the leftmost is the <strong>Most Significant Digit (MSD)</strong>.</p>
            <p>Decimal example: 3721 = (3×10³) + (7×10²) + (2×10¹) + (1×10⁰).</p>
            <p>The same principle applies to binary: 101₂ = (1×2²) + (0×2¹) + (1×2⁰) = 5₁₀.</p>
            
            <h4>1.3 Storage</h4>
            <ul>
                <li><strong>Bit:</strong> A single binary digit (0 or 1).</li>
                <li><strong>Byte:</strong> 8 bits.</li>
                <li><strong>Word:</strong> 4 bytes (32 bits) in most modern systems, though it can vary.</li>
            </ul>`,

            // Page 4
            `<h3>2. Binary, Octal and Hexadecimal Systems</h3>
            
            <h4>2.1 Binary (Base 2)</h4>
            <p>Uses only two symbols: 0 and 1. It is the fundamental system of digital electronics.</p>

            <h4>2.2 Octal (Base 8)</h4>
            <p>Uses symbols from 0 to 7. It is particularly useful because each octal digit represents exactly <strong>three binary digits</strong> (2³ = 8). It is often used as a shorthand way to represent binary numbers.</p>
            <p><em>Example:</em> 724₈ = (7×8²) + (2×8¹) + (4×8⁰) = 448 + 16 + 4 = 468₁₀.</p>

            <h4>2.3 Hexadecimal (Base 16)</h4>
            <p>Uses symbols 0-9 and letters A-F (where A=10, B=11, ..., F=15). Each hexadecimal digit represents exactly <strong>four binary digits</strong> (2⁴ = 16).</p>
            <p><em>Example:</em> ABC₁₆ = (10×16²) + (11×16¹) + (12×16⁰) = 2560 + 176 + 12 = 2748₁₀.</p>

            <h4>2.4 Comparison</h4>
            <table>
                <tr><th>Decimal</th><th>Binary</th><th>Octal</th><th>Hex</th></tr>
                <tr><td>0</td><td>0000</td><td>0</td><td>0</td></tr>
                <tr><td>1</td><td>0001</td><td>1</td><td>1</td></tr>
                <tr><td>2</td><td>0010</td><td>2</td><td>2</td></tr>
                <tr><td>8</td><td>1000</td><td>10</td><td>8</td></tr>
                <tr><td>10</td><td>1010</td><td>12</td><td>A</td></tr>
                <tr><td>15</td><td>1111</td><td>17</td><td>F</td></tr>
            </table>`,

            // Page 5
            `<h3>3. Conversions between Systems</h3>
            
            <h4>3.1 Decimal to Binary</h4>
            <p><strong>Method:</strong> Successive division by 2. The remainder of each division (from bottom to top) forms the binary number.</p>
            <p><em>Example:</em> Convert 125₁₀.</p>
            <ul>
                <li>125 ÷ 2 = 62, remainder <strong>1</strong> (LSB)</li>
                <li>62 ÷ 2 = 31, remainder <strong>0</strong></li>
                <li>31 ÷ 2 = 15, remainder <strong>1</strong></li>
                <li>15 ÷ 2 = 7, remainder <strong>1</strong></li>
                <li>7 ÷ 2 = 3, remainder <strong>1</strong></li>
                <li>3 ÷ 2 = 1, remainder <strong>1</strong></li>
                <li>1 ÷ 2 = 0, remainder <strong>1</strong> (MSB)</li>
            </ul>
            <p>Result: <strong>1111101₂</strong>.</p>

            <h4>3.2 Decimal to Octal and Hex</h4>
            <p>The principle is the same, but dividing by 8 (for octal) or by 16 (for hexadecimal).</p>
            <p><em>Octal Example:</em> 1234₁₀ divided successively by 8 = 2322₈.</p>
            <p><em>Hex Example:</em> 1234₁₀ divided successively by 16 = 4D2₁₆.</p>

            <h4>3.3 Binary to Octal and Hex</h4>
            <ul>
                <li><strong>To Octal:</strong> Group the bits in threes (from the right). Ex: 1011010111₂ → 1 (001) (011) (010) (111) → 1327₈.</li>
                <li><strong>To Hex:</strong> Group the bits in fours. Ex: 1010111011₂ → (0010) (1011) (1011) → 2BB₁₆.</li>
            </ul>

            <h4>3.4 Octal/Hex to Binary</h4>
            <p>The reverse process: convert each octal digit to 3 bits or each hex digit to 4 bits.</p>
            <p>Ex: 705₈ → 111 000 101₂. Ex: 10AF₁₆ → 0001 0000 1010 1111₂.</p>`,

            // Page 6
            `<h3>4. Binary-Coded Decimal (BCD)</h3>
            <p>BCD is a coding system that represents each decimal digit (0-9) with a 4-bit binary code. It is not a positional numbering system like the others, but rather a form of encoding.</p>
            
            <h4>4.1 BCD Characteristics</h4>
            <ul>
                <li>Each decimal digit is converted individually into 4 bits.</li>
                <li>Example: The decimal number 1895 in BCD is <strong>0001 1000 1001 0101</strong>.</li>
                <li>BCD should not be confused with pure binary representation. The pure binary of 1895 is 11101100111₂.</li>
                <li>BCD facilitates interfacing with devices that display decimal numbers (such as 7-segment displays).</li>
            </ul>

            <h4>4.2 BCD Limitations</h4>
            <ul>
                <li>A 12-bit word in pure binary can represent values from 0 to 4095.</li>
                <li>A 12-bit word in BCD can only represent values from 0 to 999 (because each 4-bit group is only valid up to 9, i.e., 1001).</li>
            </ul>

            <h4>4.3 BCD Addition</h4>
            <p>In BCD addition, if the result of a 4-bit group is greater than 1001 (9), a <strong>correction factor of 6 (0110₂)</strong> must be added to the group.</p>
            <p><em>Example:</em> 9 + 6 = 15. In BCD: 1001 + 0110 = 1111 (invalid). Add 0110: 1111 + 0110 = 0001 0101 (carry 1 to the next group, and the value is 5).</p>`,

            // Page 7
            `<h3>5. Data Types: Analog vs Digital</h3>
            
            <h4>5.1 Analog Signals</h4>
            <p>They are continuous signals that vary over time. The real world is analog (temperature, pressure, sound). These signals can be represented by variations in voltage, current, or shaft angles.</p>
            <p><em>Example:</em> The output of a microphone is an analog signal that varies continuously with sound pressure.</p>

            <h4>5.2 Digital Signals</h4>
            <p>They are discrete signals represented by logic levels (HIGH/LOW, 1/0). The main advantage is noise immunity: the exact voltage value is not critical as long as it is within the logic limits.</p>
            <p>Digital signals are processed by computers and stored as sequences of bits.</p>

            <h4>5.3 Conversion Interfaces</h4>
            <p>For digital systems to interact with the analog world, converters are necessary:</p>
            <ul>
                <li><strong>ADC (Analog-to-Digital Converter):</strong> Converts a continuous signal (e.g., temperature) into a digital value (e.g., 1010₂).</li>
                <li><strong>DAC (Digital-to-Analog Converter):</strong> Converts a digital value into a continuous signal (e.g., controlling a motor's speed).</li>
            </ul>`,

            // Page 8
            `<h3>6. Analog-to-Digital Converters (ADC)</h3>
            <p>An ADC converts a continuous voltage signal into a multi-bit digital code.</p>
            
            <h4>6.1 Principles of Operation</h4>
            <p>The conversion process involves several steps, including sampling and quantization. The <strong>resolution</strong> is determined by the number of bits in the digital word.</p>
            <ul>
                <li>An <em>n</em>-bit word divides the input range into <strong>2ⁿ</strong> quantization levels.</li>
                <li><em>Example:</em> A 3-bit ADC divides a 0-7V range into 8 levels (0, 1, 2, 3, 4, 5, 6, 7V).</li>
            </ul>

            <h4>6.2 ADC Types</h4>
            <p>There are several conversion methods, each with different trade-offs between speed and accuracy:</p>
            <ul>
                <li><strong>Flash (Parallel):</strong> The fastest, but requires many comparators (2ⁿ - 1).</li>
                <li><strong>SAR (Successive Approximation Register):</strong> Balances speed and complexity. Uses a single comparator and an internal DAC.</li>
                <li><strong>Ramp (Integrating):</strong> Slower, but very accurate and with good noise immunity.</li>
                <li><strong>Sigma-Delta:</strong> Uses high-frequency sampling and digital filters to achieve high resolution.</li>
            </ul>`,

            // Page 9
            `<h3>7. ADC Types: Flash, SAR and Ramp</h3>
            
            <h4>7.1 Flash ADC</h4>
            <p>Uses a voltage divider with multiple comparators. Conversion is done in a single clock cycle. It is the fastest type, but has a complex architecture and high power consumption. For 8 bits, 255 comparators are required.</p>

            <h4>7.2 SAR ADC (Successive Approximation)</h4>
            <p>Uses a register (SAR) that tests the bits one by one, from MSB to LSB. For 8 bits, 8 clock cycles are required. It is slower than Flash but much more efficient in terms of space and power.</p>

            <h4>7.3 Ramp Generation ADC (Counter)</h4>
            <p>A counter generates a voltage ramp (via a DAC) that is compared to the input. When the ramp exceeds the input, the counter stops. The counter value is the digital code. It is a simple but slow method.</p>

            <h4>7.4 Integration ADC (Dual Slope)</h4>
            <p>The input signal charges a capacitor for a fixed time. Then, a reference voltage discharges the capacitor, and the discharge time is measured. It is very accurate and immune to noise, ideal for instrumentation.</p>`,

            // Page 10
            `<h3>8. Digital-to-Analog Converters (DAC)</h3>
            <p>A DAC converts a digital value (usually binary) into a corresponding analog voltage or current.</p>
            
            <h4>8.1 Basic Principle</h4>
            <p>The DAC divides the reference voltage (Vref) into 2ⁿ steps. Each input bit has a specific weight. The output is the weighted sum of the bits that are set to 1.</p>
            <ul>
                <li>For an 8-bit DAC with Vref = 5V, each step (LSB) is 5V / 256 = 0.0195V.</li>
                <li>If the input is 1111 1111, the output will be 4.98V (not exactly 5V due to binary weighting).</li>
            </ul>

            <h4>8.2 DAC Types</h4>
            <ul>
                <li><strong>Weighted Resistor:</strong> Uses resistors with binary values (R, 2R, 4R, 8R...). Simple, but difficult to manufacture precisely for many bits.</li>
                <li><strong>R-2R Ladder:</strong> Uses only two resistance values (R and 2R). It is much more precise and easier to implement in integrated circuits. It is the most common method.</li>
            </ul>`,

            `<h3>10. Logic Circuits: Introduction and Basic Gates</h3>
            <p>Digital electronics is based on logic circuits that make decisions based on binary inputs. Logic gates are the fundamental building blocks.</p>
            
            <h4>10.1 AND Gate</h4>
            <p>The output is 1 only if <strong>all</strong> inputs are 1. The Boolean expression is F = A · B. It works like two switches in series.</p>
            <table>
                <tr><th>A</th><th>B</th><th>F = A·B</th></tr>
                <tr><td>0</td><td>0</td><td>0</td></tr>
                <tr><td>0</td><td>1</td><td>0</td></tr>
                <tr><td>1</td><td>0</td><td>0</td></tr>
                <tr><td>1</td><td>1</td><td>1</td></tr>
            </table>

            <h4>10.2 OR Gate</h4>
            <p>The output is 1 if <strong>any</strong> (or both) inputs are 1. The Boolean expression is F = A + B. It works like two switches in parallel.</p>
            <table>
                <tr><th>A</th><th>B</th><th>F = A+B</th></tr>
                <tr><td>0</td><td>0</td><td>0</td></tr>
                <tr><td>0</td><td>1</td><td>1</td></tr>
                <tr><td>1</td><td>0</td><td>1</td></tr>
                <tr><td>1</td><td>1</td><td>1</td></tr>
            </table>

            <h4>10.3 NOT Gate (Inverter)</h4>
            <p>Inverts the input state. If the input is 0, the output is 1; if it is 1, the output is 0. The expression is F = A' or F = Ā.</p>`,

            `<h3>11. Universal Gates (NAND/NOR) and XOR</h3>
            
            <h4>11.1 NAND Gate</h4>

            <h4>11.2 NOR Gate</h4>
            <p>It is an OR gate followed by an inverter. The output is 1 only when all inputs are 0. It is also a <strong>universal gate</strong>.</p>
            <p>Expression: F = (A + B)'.</p>

            <h4>11.3 XOR Gate (Exclusive OR)</h4>
            <p>The output is 1 only when the inputs are <strong>different</strong>. It is widely used in parity circuits and adders.</p>
            <table>
                <tr><th>A</th><th>B</th><th>F = A ⊕ B</th></tr>
                <tr><td>0</td><td>0</td><td>0</td></tr>

            // Page 14
            `<h3>12. Boolean Algebra and Truth Tables</h3>
            <p>Boolean Algebra is the mathematics that governs logic circuits. It allows expressions to be simplified and, consequently, reduces the number of gates needed in a circuit.</p>
            
            <h4>12.1 Fundamental Theorems</h4>
            <ul>
                <li><strong>Identity:</strong> A + 0 = A; A · 1 = A.</li>
                <li><strong>Annulment:</strong> A + 1 = 1; A · 0 = 0.</li>
                <li><strong>Idempotence:</strong> A + A = A; A · A = A.</li>
                <li><strong>Involution:</strong> (A')' = A.</li>
                <li><strong>Complementarity:</strong> A + A' = 1; A · A' = 0.</li>
                <li><strong>Commutativity:</strong> A + B = B + A; A · B = B · A.</li>
                <li><strong>Distributivity:</strong> A · (B + C) = (A · B) + (A · C).</li>
            </ul>

            <h4>12.2 De Morgan's Theorems</h4>
            <p>These theorems are essential for converting circuits between NAND and NOR:</p>
            <ul>
                <li>(A + B)' = A' · B' (NOR is equal to AND with inverted inputs).</li>
                <li>(A · B)' = A' + B' (NAND is equal to OR with inverted inputs).</li>
            </ul>

            <h4>12.3 Simplification</h4>
            <p>Simplifying an expression reduces the cost and delay of the circuit. For example, the expression P + (P · Q) simplifies to P (Absorption Theorem).</p>`,

            <p>Logic circuits are generally mounted in DIP (Dual In-line Package) packages, with pins spaced 0.1 inch apart. The most common have 14 or 16 pins.</p>`,

        function tokenizeTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }
            textNodes.forEach(node => {
                const text = node.textContent;
                if (!text.trim()) return;
                if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;
                const fragment = document.createDocumentFragment();
                const parts = text.split(/(\s+)/);
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'speech-word';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

                if (idx < spans.length - 1) map.push(idx);

            return map;

            speakBtn.classList.add('hidden');
        }

        function showStoppedUI() {
            speakBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
        }

        function setSelectionBtnState(state) {
            lerSelecaoBtn.classList.remove('reading', 'paused');
            if (state === 'reading') {
                lerSelecaoBtn.textContent = '⏸️ Pause';
                lerSelecaoBtn.title = 'Pause selection reading';
                lerSelecaoBtn.classList.add('reading');
            } else if (state === 'paused') {
                lerSelecaoBtn.textContent = '▶️ Resume';
                lerSelecaoBtn.title = 'Resume selection reading';
                lerSelecaoBtn.classList.add('paused');
            } else {
                lerSelecaoBtn.textContent = '📖 Read Selection';
                lerSelecaoBtn.title = 'Read only the selected text';
            }
        }

        function startReading() {
            if (!synth) { alert('Your browser does not support speech synthesis.'); return; }
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();

            if (isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
                return;
            }
            if (isSpeaking) { stopReading(); return; }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
            }
            buildCharMap();
            if (wordSpans.length === 0) return;

            const text = wordSpans.map(s => s.textContent).join(' ');
            currentUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) currentUtterance.voice = voice;
            currentUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            speechToken = token;
            currentCharIndex = 0;

            currentUtterance.onboundary = function(event) {
                if (speechToken !== token) return;
                if (event.name === 'word') {
                    currentCharIndex = event.charIndex;
                    syncHighlightFromCharIndex();
                }
            };
            currentUtterance.onstart = function() {
                if (speechToken !== token) return;
                isSpeaking = true;
                isPaused = false;
                showPlayingUI();
            };
            currentUtterance.onend = function() {
                if (speechToken !== token) return;
                resetSpeechState();
            };
            currentUtterance.onerror = function(e) {
                if (speechToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Speech error:', e.error);
                resetSpeechState();
            };

            synth.speak(currentUtterance);
        }

        function pauseReading() {
            if (synth && isSpeaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showPausedUI();
            }
        }

        function resumeReading() {
            if (synth && isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
            }
        }

        function stopReading() {
            if (synth) synth.cancel();
            resetSpeechState();
        }

        function resetSpeechState() {
            if (synth && synth.speaking) synth.cancel();
            if (currentUtterance) {
                currentUtterance.onboundary = null;
                currentUtterance.onstart = null;
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance = null;
            }
            isSpeaking = false;
            isPaused = false;
            speechToken = null;
            currentCharIndex = 0;
            clearAllWordHighlights();
            showStoppedUI();
        }

        function startSelectionReading() {
            if (!synth) { alert('Your browser does not support speech synthesis.'); return; }
            if (isSpeaking || isPaused) stopReading();

            const range = getActiveSelectionRange();
            if (!range) {
                alert('No text selected. Please select a passage and click "Read Selection".');
                return;
            }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
                const newRange = getActiveSelectionRange();
                if (!newRange) {
                    alert('Please select the desired passage again.');
                    return;
                }
                return startSelectionReadingWithRange(newRange);
            }

            startSelectionReadingWithRange(range);
        }

        function startSelectionReadingWithRange(range) {
            const spans = [];
            pageContent.querySelectorAll('.speech-word').forEach(span => {
                try {
                    if (range.intersectsNode(span)) spans.push(span);
                } catch(e) {}
            });

            if (spans.length === 0) {
                alert('No text selected. Please select a passage and click "Read Selection".');
                return;
            }

            selectionWordSpans = spans;
            selectionCharMap = buildCharMapForSpans(selectionWordSpans);
            clearSelectionHighlights();

            const text = spans.map(s => s.textContent).join(' ');
            selectionUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) selectionUtterance.voice = voice;
            selectionUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            selectionToken = token;

            selectionUtterance.onboundary = function(event) {
                if (selectionToken !== token) return;
                if (event.name === 'word') {
                    const charIdx = event.charIndex;
                    if (charIdx < selectionCharMap.length) {
                        const spanIdx = selectionCharMap[charIdx];
                        if (spanIdx !== undefined) highlightSelectionWord(spanIdx);
                    }
                }
            };
            selectionUtterance.onstart = function() {
                if (selectionToken !== token) return;
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
                stopBtn.classList.remove('hidden');
            };
            selectionUtterance.onend = function() {
                if (selectionToken !== token) return;
                resetSelectionState();
            };
            selectionUtterance.onerror = function(e) {
                if (selectionToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Selection speech error:', e.error);
                resetSelectionState();
            };

            synth.speak(selectionUtterance);
        }

        function toggleSelectionReading() {
            if (isReadingSelection) {
                synth.pause();
                isReadingSelection = false;
                isSelectionPaused = true;
                setSelectionBtnState('paused');
            } else if (isSelectionPaused) {
                synth.resume();
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
            } else {
                startSelectionReading();
            }
        }

        function stopSelectionReading() {
            if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
            resetSelectionState();
        }

        function resetSelectionState() {
            if (selectionUtterance) {
                selectionUtterance.onboundary = null;
                selectionUtterance.onstart = null;
                selectionUtterance.onend = null;
                selectionUtterance.onerror = null;
                selectionUtterance = null;
            }
            isReadingSelection = false;
            isSelectionPaused = false;
            selectionToken = null;
            clearSelectionHighlights();
            setSelectionBtnState('idle');
            stopBtn.classList.add('hidden');
        }

        function updateUI() {
            resetSpeechState();
            resetSelectionState();
            pageContent.innerHTML = pageContents[currentPage];
            tokenizeTextNodes(pageContent);
            lastSelectionRange = null;
            lastSelectionText = '';

            const num = currentPage + 1;
            pageXofY.textContent = `Page ${num} of ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);

            if (currentPage === totalPages - 1) {
                encerrarBtn.classList.remove('hidden');
            } else {
                encerrarBtn.classList.add('hidden');
            }

            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
