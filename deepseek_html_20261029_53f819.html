            // Page 3
            `<h3>1. Introduction to Data Buses</h3>
            <p>A <strong>data bus</strong> is the "pathway" through which digital information travels between the various systems and computers of an aircraft. As aircraft became more complex, reliability, weight, and data transmission capacity became critical factors.</p>

            <h4>1.1 Why Use Data Buses?</h4>
            <ul>
                <li><strong>Weight Reduction:</strong> Instead of a dedicated wire for each signal (point-to-point wiring), a single twisted pair can carry hundreds of parameters.</li>
                <li><strong>Redundancy:</strong> Multiple paths can be configured to ensure that the failure of one bus does not compromise the flight.</li>
                <li><strong>Standardization:</strong> Allows equipment from different manufacturers (LRUs) to "speak the same language."</li>
            </ul>

            <h4>1.2 Terminology</h4>
            <ul>
                <li><strong>Protocol:</strong> The rules of communication (how data is formatted, addressed, and synchronized).</li>
                <li><strong>Simplex:</strong> Unidirectional communication.</li>
                <li><strong>Half-duplex:</strong> Communication in both directions, but not at the same time.</li>
                <li><strong>Full-duplex:</strong> Communication in both directions simultaneously.</li>
                <li><strong>Single Source / Multiple Sink:</strong> One transmitter to multiple receivers.</li>
                <li><strong>Multiple Source / Multiple Sink:</strong> Multiple transmitters and multiple receivers on the same bus.</li>
            </ul>

            <h4>1.3 Main Protocols in Aviation</h4>
            <ul>
                <li><strong>ARINC 429:</strong> The most common in commercial and business aircraft.</li>
                <li><strong>ARINC 629:</strong> Used on the Boeing 777.</li>
                <li><strong>MIL-STD-1553:</strong> Military standard, very robust and redundant.</li>
                <li><strong>AFDX:</strong> Ethernet-based, used in modern aircraft like the A380 and B787.</li>
            </ul>`,

            // Page 4
            `<h3>2. ARINC 429: The Most Common Standard</h3>
            <p>ARINC 429 is the most widespread data bus standard in commercial aviation. It was designed to be simple and highly reliable.</p>

            <h4>2.1 Main Characteristics</h4>
            <ul>
                <li><strong>Unidirectional Transmission (Simplex):</strong> One transmitter sends to up to 20 receivers on the same pair of wires.</li>
                <li><strong>32-bit Word:</strong> Data is organized in 32-bit words.</li>
                <li><strong>BPRZ Encoding:</strong> Bipolar Return to Zero, with three states: HIGH (+10V), NULL (0V), and LOW (-10V).</li>
                <li><strong>Transmission Rate:</strong> 12.5 kbps (low speed) or 100 kbps (high speed).</li>
            </ul>

            <h4>2.2 ARINC 429 Word Structure</h4>
            <ul>
                <li><strong>Bits 1-8 (Label):</strong> Identifies the type of data (e.g., altitude, speed). It is transmitted in octal.</li>
                <li><strong>Bits 9-10 (SDI):</strong> Source/Destination Identifier, for multiple receivers.</li>
                <li><strong>Bits 11-29 (Data):</strong> The numeric value (BNR or BCD).</li>
                <li><strong>Bits 30-31 (SSM):</strong> Sign/Status Matrix (indicates validity, test, failure, or positive/negative sign).</li>
                <li><strong>Bit 32 (Parity):</strong> Parity bit (usually odd) for error detection.</li>
            </ul>

            <h4>2.3 Advantages and Disadvantages</h4>
            <ul>
                <li><strong>Advantage:</strong> High reliability, simple implementation, widely supported.</li>
                <li><strong>Disadvantage:</strong> Requires many pairs of wires (due to unidirectionality), limit of 20 receivers per transmitter, relatively low speed by today's standards.</li>
            </ul>`,

            // Page 5
            `<h3>3. ARINC 629: The Boeing 777 Bus</h3>
            <p>To overcome the limitations of ARINC 429, ARINC 629 was developed as a high-speed, bidirectional bus used on the Boeing 777.</p>

            <h4>3.1 Characteristics</h4>
            <ul>
                <li><strong>Half-duplex:</strong> Allows multiple terminals to transmit and receive, but only one transmits at a time.</li>
                <li><strong>Speed:</strong> 2 Mbps (much faster than ARINC 429).</li>
                <li><strong>Capacity:</strong> Up to 120 terminals connected to the same unshielded twisted pair.</li>
                <li><strong>Inductive Coupling:</strong> LRUs connect to the bus through inductive couplers (no need to cut the cable), increasing reliability.</li>
            </ul>

            <h4>3.2 Protocol and Modes</h4>
            <ul>
                <li><strong>Periodic Mode:</strong> Transmission at regular intervals, used for critical flight data.</li>
                <li><strong>Aperiodic Mode:</strong> Event-driven transmission, used for less critical data.</li>
                <li><strong>Terminal Gap (TG):</strong> Each terminal has a unique "gap" time, which defines its transmission priority.</li>
            </ul>
            <p>ARINC 629 was designed to drastically reduce the amount of wiring in the Boeing 777 compared to the 747, improving fuel efficiency.</p>`,

            // Page 6
            `<h3>4. MIL-STD-1553: The Military Standard</h3>
            <p>MIL-STD-1553 is a military data bus standard, widely used in combat aircraft (F-16, F-18) and also in some commercial aircraft and helicopters.</p>

            <h4>4.1 Characteristics</h4>
            <ul>
                <li><strong>Speed:</strong> 1 Mbps.</li>
                <li><strong>20-bit Words:</strong> 16 data bits + 4 control bits.</li>
                <li><strong>Encoding:</strong> Manchester II bi-phase.</li>
                <li><strong>Topology:</strong> Dual redundant bus with STP (Shielded Twisted Pair) cables.</li>
                <li><strong>Control:</strong> A <em>Bus Controller</em> (BC) manages communication, sending commands to the <em>Remote Terminals</em> (RT).</li>
            </ul>

            <h4>4.2 Advantages</h4>
            <ul>
                <li>Highly robust and resistant to interference.</li>
                <li>Integrated redundancy (path A and B).</li>
                <li>Built-in error detection.</li>
            </ul>
            <p>ARINC 429 is generally found in commercial aircraft, while MIL-STD-1553 is the standard for military applications where robustness and integrity are critical.</p>`,

            // Page 7
            `<h3>5. Ethernet and AFDX (Avionics Full-Duplex Switched Ethernet)</h3>
            <p>Modern aircraft, such as the Airbus A380 and Boeing 787, require much higher bandwidths than those offered by ARINC 429 or 629. The solution was to adapt the Ethernet standard (IEEE 802.3) for aviation, creating <strong>AFDX</strong> (ARINC 664).</p>

            <h4>5.1 AFDX Characteristics</h4>
            <ul>
                <li><strong>Full-duplex:</strong> Simultaneous transmission and reception.</li>
                <li><strong>Deterministic:</strong> Guarantees specific bandwidth and maximum latency time, essential for critical systems.</li>
                <li><strong>Virtual Links (VL):</strong> Dedicated logical paths that guarantee bandwidth allocation.</li>
                <li><strong>BAG (Bandwidth Allocation Gap):</strong> The minimum interval between two consecutive transmissions of a VL.</li>
                <li><strong>Redundancy:</strong> Simultaneous transmission over two independent networks (A and B).</li>
            </ul>

            <h4>5.2 AFDX Advantages</h4>
            <ul>
                <li>Drastic reduction in wiring (replaces hundreds of ARINC 429 buses).</li>
                <li>High speeds (10/100 Mbps).</li>
                <li>Based on COTS (Commercial Off-The-Shelf), reducing costs.</li>
            </ul>`,

            // Page 8
            `<h3>6. Fiber Optics: Introduction and Advantages</h3>
            <p>Fiber optics is a data transmission technology that uses light instead of electricity. It is increasingly used in modern aircraft to overcome the limitations of copper.</p>

            <h4>6.1 Advantages of Fiber Optics</h4>
            <ul>
                <li><strong>Bandwidth:</strong> Much higher capacity than copper.</li>
                <li><strong>EMI/RFI Immunity:</strong> Light is not affected by electromagnetic interference.</li>
                <li><strong>Electrical Isolation:</strong> No electrical conduction, eliminating risks of short circuits and sparks.</li>
                <li><strong>Weight Reduction:</strong> Fiber is much lighter than copper (e.g., 4 kg/km).</li>
                <li><strong>Security:</strong> It is very difficult to intercept optical signals (they do not radiate).</li>
                <li><strong>No Crosstalk:</strong> No interference between adjacent fibers.</li>
            </ul>

            <h4>6.2 Disadvantages</h4>
            <ul>
                <li>Higher initial cost of components and installation.</li>
                <li>Greater maintenance complexity (requires specific tools and training).</li>
                <li>Higher sensitivity to tight bends (microbending loss).</li>
            </ul>`,

            // Page 9
            `<h3>7. Physical Principles of Fiber Optics</h3>
            <p>Fiber optics works based on the principle of <strong>total internal reflection</strong>. Light is confined within the core of the fiber and guided along its length.</p>

            <h4>7.1 Fiber Structure</h4>
            <ul>
                <li><strong>Core:</strong> The center of the fiber, made of high-purity glass, where light travels. It has a refractive index (n1).</li>
                <li><strong>Cladding:</strong> A layer of glass or plastic surrounding the core. It has a refractive index (n2) slightly lower than the core (n2 < n1).</li>
                <li><strong>Buffer/Coating:</strong> A plastic layer that protects the fiber from physical damage and moisture.</li>
            </ul>

            <h4>7.2 Total Internal Reflection</h4>
            <p>When light travels from the core to the cladding and the angle of incidence is greater than the <strong>critical angle</strong>, the light is fully reflected back into the core. This allows light to travel long distances with minimal loss.</p>
            <p><em>Condition:</em> n1 > n2.</p>

            <h4>7.3 Attenuation and Dispersion</h4>
            <ul>
                <li><strong>Attenuation:</strong> Loss of optical power along the fiber (absorption and scattering).</li>
                <li><strong>Dispersion:</strong> The broadening of the light pulse as it travels, limiting bandwidth.</li>
                <li><strong>Operating Windows:</strong> 850 nm, 1300 nm, and 1550 nm are the lowest attenuation windows in silica fiber.</li>
            </ul>`,

            // Page 10
            `<h3>8. Fiber Types: Single-Mode vs Multimode</h3>
            <p>Optical fibers are mainly classified by the number of modes (paths) that light can take within the core.</p>

            <h4>8.1 Multimode Fiber</h4>
            <ul>
                <li><strong>Large Core:</strong> 50 µm or 62.5 µm.</li>
                <li><strong>Multiple Paths:</strong> Light propagates through multiple paths, causing modal dispersion (pulses broaden).</li>
                <li><strong>Light Source:</strong> Usually LEDs (cheaper).</li>
                <li><strong>Applications:</strong> Short distances, local area networks (LANs), aircraft systems (e.g., A380 uses 62.5/125 µm).</li>
                <li><strong>Advantage:</strong> Easier to connect and couple to light sources.</li>
            </ul>

            <h4>8.2 Single-Mode Fiber</h4>
            <ul>
                <li><strong>Small Core:</strong> 8-10 µm.</li>
                <li><strong>Single Path:</strong> Only the fundamental mode propagates, eliminating modal dispersion.</li>
                <li><strong>Light Source:</strong> Lasers (more expensive and powerful).</li>
                <li><strong>Applications:</strong> Long distances, high-speed telecommunications.</li>
                <li><strong>Advantage:</strong> Lower attenuation and higher bandwidth.</li>
            </ul>

            <h4>8.3 Comparison</h4>
            <table>
                <tr><th>Characteristic</th><th>Multimode</th><th>Single-Mode</th></tr>
                <tr><td>Core Diameter</td><td>50 / 62.5 µm</td><td>8-10 µm</td></tr>
                <tr><td>Dispersion</td><td>High (modal)</td><td>Very Low</td></tr>
                <tr><td>Source</td><td>LED / VCSEL</td><td>Laser</td></tr>
                <tr><td>Cost</td><td>Lower</td><td>Higher</td></tr>
                <tr><td>Distance</td><td>Short/Medium</td><td>Long</td></tr>
            </table>`,

            // Page 11
            `<h3>9. Fiber Optic Connectors and Terminals</h3>
            <p>Connecting optical fibers requires extreme precision to ensure core alignment and minimize losses.</p>

        function tokenizeTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }
            textNodes.forEach(node => {
                const text = node.textContent;
                if (!text.trim()) return;
                if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;
                const fragment = document.createDocumentFragment();
                const parts = text.split(/(\s+)/);
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'speech-word';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function buildCharMapForSpans(spans) {
            const map = [];
            spans.forEach((span, idx) => {
                const len = span.textContent.length;
                for (let i = 0; i < len; i++) map.push(idx);
                if (idx < spans.length - 1) map.push(idx);
            });
            return map;
        }

        function buildCharMap() {
            wordSpans = Array.from(pageContent.querySelectorAll('.speech-word'));
            charIndexToSpanMap = buildCharMapForSpans(wordSpans);

                if (prevSpan) {
                    prevSpan.classList.remove('active');
                    prevSpan.classList.remove('upcoming');

        function markUpcoming(spanIndex) {
            wordSpans.forEach(s => s.classList.remove('upcoming'));
            for (let i = 1; i <= 3; i++) {
                const nextIdx = spanIndex + i;
                if (nextIdx < wordSpans.length) {
                    wordSpans[nextIdx].classList.add('upcoming');

            }
        }

            wordSpans.forEach(s => {

        function syncHighlightFromCharIndex() {
            if (currentCharIndex >= charIndexToSpanMap.length) return;
            const spanIdx = charIndexToSpanMap[currentCharIndex];
            if (spanIdx !== undefined && spanIdx !== previousActiveSpan) {
                highlightWordSpan(spanIdx);

            if (synth && isSpeaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showPausedUI();
            }
        }

        function resumeReading() {
            if (synth && isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
            }
        }

        function stopReading() {
            if (synth) synth.cancel();
            resetSpeechState();
        }

        function resetSpeechState() {
            if (synth && synth.speaking) synth.cancel();
            if (currentUtterance) {
                currentUtterance.onboundary = null;
                currentUtterance.onstart = null;
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance = null;
            }
            isSpeaking = false;
            isPaused = false;
            speechToken = null;
            currentCharIndex = 0;
            clearAllWordHighlights();
            showStoppedUI();
        }

        function startSelectionReading() {
            if (!synth) { alert('Your browser does not support speech synthesis.'); return; }
            if (isSpeaking || isPaused) stopReading();

            const range = getActiveSelectionRange();
            if (!range) {
                alert('No text selected. Please select a passage and click "Read Selection".');
                return;
            }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
                const newRange = getActiveSelectionRange();
                if (!newRange) {
                    alert('Please select the desired passage again.');
                    return;
                }
                return startSelectionReadingWithRange(newRange);
            }

            startSelectionReadingWithRange(range);
        }

        function startSelectionReadingWithRange(range) {
            const spans = [];
            pageContent.querySelectorAll('.speech-word').forEach(span => {
                try {
                    if (range.intersectsNode(span)) spans.push(span);
                } catch(e) {}
            });

            if (spans.length === 0) {
                alert('No text selected. Please select a passage and click "Read Selection".');
                return;
            }

            selectionWordSpans = spans;
            selectionCharMap = buildCharMapForSpans(selectionWordSpans);
            clearSelectionHighlights();

            const text = spans.map(s => s.textContent).join(' ');
            selectionUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) selectionUtterance.voice = voice;
            selectionUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            selectionToken = token;

            selectionUtterance.onboundary = function(event) {
                if (selectionToken !== token) return;
                if (event.name === 'word') {
                    const charIdx = event.charIndex;
                    if (charIdx < selectionCharMap.length) {
                        const spanIdx = selectionCharMap[charIdx];
                        if (spanIdx !== undefined) highlightSelectionWord(spanIdx);
                    }
                }
            };
            selectionUtterance.onstart = function() {
                if (selectionToken !== token) return;
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
                stopBtn.classList.remove('hidden');
            };
            selectionUtterance.onend = function() {
                if (selectionToken !== token) return;
                resetSelectionState();
            };
            selectionUtterance.onerror = function(e) {
                if (selectionToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Selection speech error:', e.error);
                resetSelectionState();
            };

            synth.speak(selectionUtterance);
        }

        function toggleSelectionReading() {
            if (isReadingSelection) {
                synth.pause();
                isReadingSelection = false;
                isSelectionPaused = true;
                setSelectionBtnState('paused');
            } else if (isSelectionPaused) {
                synth.resume();
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
            } else {
                startSelectionReading();
            }
        }

        function stopSelectionReading() {
            if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
            resetSelectionState();
        }

        function resetSelectionState() {
            if (selectionUtterance) {
                selectionUtterance.onboundary = null;
                selectionUtterance.onstart = null;
                selectionUtterance.onend = null;
                selectionUtterance.onerror = null;
                selectionUtterance = null;
            }
            isReadingSelection = false;
            isSelectionPaused = false;
            selectionToken = null;
            clearSelectionHighlights();
            setSelectionBtnState('idle');
            stopBtn.classList.add('hidden');
        }

        function updateUI() {
            resetSpeechState();
            resetSelectionState();
            pageContent.innerHTML = pageContents[currentPage];
            tokenizeTextNodes(pageContent);
            lastSelectionRange = null;
            lastSelectionText = '';

            const num = currentPage + 1;
            pageXofY.textContent = `Page ${num} of ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);

            if (currentPage === totalPages - 1) {
                encerrarBtn.classList.remove('hidden');
            } else {
                encerrarBtn.classList.add('hidden');
            }

            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
