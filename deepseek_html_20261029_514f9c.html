<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz 1 · Eletrónica Digital e Sistemas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #eef2f7;
            color: #2d3748;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            margin: 0;
        }
        .quiz-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(45, 55, 72, 0.08);
            padding: 20px 24px;
            border: 1px solid #cbd5e0;
            height: 90vh; /* Altura fixa em 90% */
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }
        .screen { display: none; }
        .screen.active { 
            display: flex; 
            flex-direction: column; 
            height: 100%;
            justify-content: space-between;
        }

        .blank-screen {
            display: none;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .blank-screen.active { display: block; }
        .wrapper-blank {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .header-container {
            flex-shrink: 0;
        }

        /* Controlos de Acessibilidade */
        .font-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .font-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            color: #2d3748;
            font-size: 1rem;
            transition: 0.15s;
        }
        .font-btn:hover { background: #cbd5e0; }

        .title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2b6cb0;
            margin-bottom: 8px;
            text-align: center;
        }
        
        #questionArea {
            flex-grow: 1;
            overflow-y: auto; 
            padding-right: 5px;
            margin-bottom: 10px;
        }
        
        /* Fontes duplicadas para as perguntas */
        .question-text {
            font-size: 3rem; 
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.3;
            color: #2d3748;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 18px;
        }
        /* Fontes duplicadas para as respostas */
        .opt-btn {
            background: #edf2f7;
            border: 1px solid #a0aec0;
            padding: 18px 24px;
            font-size: 2.2rem; 
            border-radius: 12px;
            cursor: pointer;
            transition: 0.15s;
            color: #2d3748;
            text-align: left;
            width: 100%;
            font-weight: 500;
        }
        .opt-btn:hover {
            background: #e2e8f0;
            border-color: #718096;
        }
        .opt-btn.selected {
            background: #2b6cb0;
            color: #ffffff;
            border-color: #2b6cb0;
        }
        /* Fontes duplicadas para as justificativas */
        .feedback {
            margin-top: 18px;
            padding: 18px 22px;
            border-radius: 16px;
            font-size: 1.8rem;
            line-height: 1.4;
            display: none;
        }
        .feedback.correct { background: #f0fff4; border-left: 8px solid #38a169; }
        .feedback.wrong { background: #fff5f5; border-left: 8px solid #e53e3e; }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
            margin-top: 10px;
        }
        .tool-btn {
            background: #edf2f7;
            border: 1px solid #a0aec0;
            padding: 14px 0;
            font-size: 1.1rem;
            border-radius: 48px;
            width: 140px; /* Tamanho fixo */
            flex: none;
            text-align: center;
            cursor: pointer;
            color: #2d3748;
            font-weight: 600;
            transition: 0.15s;
        }
        .tool-btn:hover:not(:disabled) {
            background: #e2e8f0;
            border-color: #718096;
        }
        .tool-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .progress {
            font-size: 0.9rem;
            margin-bottom: 12px;
            color: #2b6cb0;
            text-align: right;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .result-screen { text-align: center; justify-content: center !important; }
        .result-box {
            background: #f7fafc;
            padding: 20px;
            border-radius: 24px;
            margin: 20px 0;
            border: 1px solid #e2e8f0;
        }
        .action-btn {
            background: #2b6cb0;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.15s;
        }
        .action-btn:hover { background: #2c5282; }
        .action-btn.end-btn { background: #dd6b20; }
        .action-btn.end-btn:hover { background: #c05621; }
        .stats { font-size: 1.1rem; line-height: 1.8; }

        .capa { text-align: center; padding: 30px 10px; }
        .capa h1 { font-size: 26px; margin-bottom: 16px; color: #2b6cb0; }
        .capa h2 { font-size: 17px; margin-bottom: 12px; color: #dd6b20; }
        .capa .subtitulo { font-size: 14px; color: #4a5568; margin-bottom: 8px; }
        .capa .info-quiz { font-size: 15px; color: #718096; margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .start-btn {
            background: #2b6cb0;
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 22px;
            font-weight: bold;
            transition: 0.15s;
        }
        .start-btn:hover { background: #2c5282; }

        @media (max-width: 800px) {
            .quiz-wrapper { padding: 12px; }
            .question-text { font-size: 2rem; }
            .opt-btn { font-size: 1.5rem; padding: 14px 18px;}
            .feedback { font-size: 1.3rem; }
            .tool-btn { width: 110px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="quiz-wrapper" id="mainWrapper">
    <!-- TELA DE CAPA -->
    <div id="capaScreen" class="screen active">
        <div class="capa">
            <h1>📝 Quiz 1</h1>
            <h2>Eletrónica Digital e Sistemas de Aeronaves</h2>
            <p class="subtitulo">Revisão baseada no Teste-01 e Módulo 5B2</p>
            <p class="info-quiz">20 questões objetivas (Múltipla Escolha)</p>
            <button class="start-btn" id="startQuizBtn">▶ Iniciar Quiz</button>
        </div>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="quizScreen" class="screen">
        <div class="header-container">
            <div class="font-controls">
                <button class="font-btn" id="fontMinus">A−</button>
                <button class="font-btn" id="fontPlus">A+</button>
                <button class="font-btn" id="fullscreenBtn">⛶ Tela cheia</button>
            </div>
            <div class="title">📖 Eletrónica Digital</div>
            <div class="progress" id="progressText">Questão 1 de 20</div>
        </div>
        
        <div id="questionArea">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsArea"></div>
            <div class="feedback" id="feedbackArea" style="display: none;"></div>
        </div>
        
        <div class="toolbar">
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn">Próxima ▶</button>
        </div>
    </div>

    <!-- TELA DE RESULTADO -->
    <div id="resultScreen" class="screen result-screen">
        <h2>🙏 Parabéns! Você concluiu o Quiz 1.</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="action-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
        <button class="action-btn end-btn" id="endQuizBtn">🏁 Encerrar</button>
    </div>

    <!-- TELA EM BRANCO -->
    <div class="blank-screen" id="blankScreen"></div>
</div>

<script>
    const questions = [
        {
            text: "O sistema Fly-by-wire degrada para Direct Mode. Como se caracteriza a relação do Flight Control Computer com a resposta da aeronave neste modo?",
            options: [
                "O computador continua a receber normalmente feedback da aeronave.",
                "O computador não recebe feedback da aeronave.",
                "O computador seleciona automaticamente entre vários tipos de feedback."
            ],
            correctIndex: 1,
            justification: "No modo Direct, o computador de controle de voo (FCC) não recebe feedback da aeronave. Isso resulta na perda das leis de proteção do envelope de voo (Normal Law) e das compensações automáticas, tornando a resposta da aeronave mais direta às ações do piloto."
        },
        {
            text: "Durante a documentação de software segundo o DO-178, que informação relativa ao software desenvolvido deve ser indicada pelo fabricante?",
            options: [
                "O tamanho final do software e as linguagens utilizadas.",
                "Somente os resultados dos testes que apresentaram falhas.",
                "Apenas uma estimativa inicial do tamanho do software."
            ],
            correctIndex: 0,
            justification: "O padrão DO-178 exige que o fabricante declare o tamanho final do software (por exemplo, em bytes de memória ou número de módulos) e as linguagens de programação utilizadas na seção de 'Organização do Software' do Software Accomplishment Summary."
        },
        {
            text: "O CPU necessita de comunicar especificamente com um dos vários dispositivos de entrada/saída ligados ao sistema. Como é identificado o dispositivo pretendido?",
            options: [
                "Através da frequência de clock do processador.",
                "Através do respetivo endereço.",
                "Através do valor existente no acumulador."
            ],
            correctIndex: 1,
            justification: "Cada dispositivo de entrada/saída é mapeado num endereço específico. O CPU utiliza o barramento de endereços (Address Bus) para enviar o endereço do dispositivo pretendido e selecioná-lo para comunicação."
        },
        {
            text: "Os quatro bits menos significativos de uma palavra digital apresentam o valor 1101. Qual é o seu equivalente decimal?",
            options: [
                "14",
                "11",
                "13"
            ],
            correctIndex: 2,
            justification: "O valor binário 1101 corresponde a (1×2³) + (1×2²) + (0×2¹) + (1×2⁰) = 8 + 4 + 0 + 1 = 13."
        },
        {
            text: "Qual é a representação binária correspondente ao número decimal 172?",
            options: [
                "10100110",
                "11001100",
                "10101100"
            ],
            correctIndex: 2,
            justification: "Convertendo 172 para binário: 172 = 128 + 32 + 8 + 4. Portanto, a representação em 8 bits é 10101100₂."
        },
        {
            text: "As entradas X e Y são aplicadas a uma porta AND cuja saída passa posteriormente por uma porta NOT. Em que situação a saída final assume o estado lógico 0?",
            options: [
                "X = 1 e Y = 0",
                "X = 1 e Y = 1",
                "X = 0 e Y = 1"
            ],
            correctIndex: 1,
            justification: "A porta AND só produz saída 1 quando ambas as entradas são 1. A porta NOT inverte esse valor, então a saída final será 0 quando ambas as entradas X e Y forem 1 (1 AND 1 = 1; NOT 1 = 0)."
        },
        {
            text: "Ao comparar um LCD Twisted Nematic (TN) com outros tipos de LCD, qual característica lhe é atribuída no material?",
            options: [
                "Brilho muito elevado.",
                "Excelente desempenho para imagens em movimento.",
                "Contraste reduzido."
            ],
            correctIndex: 2,
            justification: "Os LCDs do tipo TN (Twisted Nematic) são conhecidos por terem um contraste reduzido e ângulos de visão mais limitados em comparação com outras tecnologias (como IPS ou VA), embora sejam mais baratos e rápidos."
        },
        {
            text: "Um DAC de 4 bits, com uma gama de saída de 0 a 16 V, recebe a palavra digital 1010. Considerando uma resolução de 1 V por nível, qual será a tensão de saída?",
            options: [
                "12 V",
                "8 V",
                "10 V"
            ],
            correctIndex: 2,
            justification: "A palavra digital 1010 em binário equivale a 10 em decimal. Como a resolução é de 1 V por nível, a tensão de saída será 10 V."
        },
        {
            text: "O TCAS determina que um conflito de tráfego exige uma manobra de resolução. A que zona de proteção corresponde esta situação?",
            options: [
                "Surveillance",
                "RA (Resolution Advisory)",
                "TA (Traffic Advisory)"
            ],
            correctIndex: 1,
            justification: "O TCAS emite um Traffic Advisory (TA) para alertar a tripulação sobre tráfego próximo. Se o conflito se tornar iminente, emite um Resolution Advisory (RA) que instrui uma manobra vertical específica (subir ou descer) para evitar a colisão."
        },
        {
            text: "Pretende-se utilizar um barramento capaz de efetuar transmissão simultânea nos dois sentidos. Qual das seguintes especificações suporta operação full-duplex?",
            options: [
                "ARINC 664",
                "ARINC 429",
                "ARINC 629"
            ],
            correctIndex: 0,
            justification: "O ARINC 664 (AFDX) baseia-se em Ethernet comutada full-duplex, permitindo transmissão e recepção simultâneas. O ARINC 429 é unidirecional (simplex) e requer dois pares para comunicação bidirecional."
        },
        {
            text: "Dois bits e um carry-in proveniente de uma operação anterior têm de ser adicionados simultaneamente. Que circuito lógico é adequado para realizar esta operação?",
            options: [
                "Meio somador (half adder)",
                "Descodificador",
                "Somador completo (full adder)"
            ],
            correctIndex: 2,
            justification: "Um somador completo (full adder) é capaz de somar dois bits de entrada juntamente com um carry-in, produzindo a soma e um carry-out. O meio somador apenas soma dois bits, sem considerar o carry-in."
        },
        {
            text: "Uma porta AND possui quatro entradas com os estados 1, 1, 1 e 0. Qual será o valor lógico presente na saída?",
            options: [
                "Alta impedância",
                "0",
                "1"
            ],
            correctIndex: 1,
            justification: "A porta AND (E) só produz saída 1 quando todas as suas entradas são 1. Como uma das entradas é 0, a saída será obrigatoriamente 0."
        },
        {
            text: "Durante a execução de várias operações, o processador necessita de manter temporariamente pequenas quantidades de dados disponíveis para utilização imediata. Onde são normalmente mantidos esses dados?",
            options: [
                "Nos registadores do CPU",
                "Na memória secundária",
                "Nas linhas do barramento de controlo"
            ],
            correctIndex: 0,
            justification: "Os registadores são memórias de alta velocidade localizadas dentro do próprio CPU. São utilizados para armazenar temporariamente dados e instruções que estão a ser processados, garantindo acesso imediato."
        },
        {
            text: "Quanto ao modo como a luz atravessa o dispositivo, como é classificado o visor eletrónico utilizado num PFD?",
            options: [
                "Transmissivo",
                "Reflexivo",
                "Trans-reflexivo"
            ],
            correctIndex: 0,
            justification: "Os visores dos PFDs (e da maioria dos LCDs modernos) são do tipo transmissivo, onde a luz provém de uma retroiluminação (backlight) e atravessa as camadas do LCD para os olhos do piloto."
        },
        {
            text: "Uma aeronave modernizada substitui vários instrumentos eletromecânicos por ecrãs capazes de apresentar diferentes tipos de informação de voo. Esta configuração corresponde a:",
            options: [
                "Um sistema em que cada parâmetro necessita obrigatoriamente de um instrumento mecânico independente.",
                "Um cockpit baseado exclusivamente em instrumentos analógicos.",
                "Um glass cockpit."
            ],
            correctIndex: 2,
            justification: "Um 'glass cockpit' é uma configuração de cabine que utiliza ecrãs eletrónicos (displays) em vez dos tradicionais instrumentos mecânicos e mostradores analógicos, permitindo a exibição flexível de múltiplos dados."
        },
        {
            text: "Dois enlaces óticos utilizam fibras com características diferentes. Num deles, a luz pode propagar-se através de vários percursos dentro do núcleo. Que tipo de fibra está a ser utilizado?",
            options: [
                "Fibra multimodo",
                "Fibra de modo único sem reflexão interna",
                "Fibra monomodo"
            ],
            correctIndex: 0,
            justification: "A fibra multimodo permite a propagação da luz através de múltiplos caminhos (modos) dentro do núcleo, o que causa dispersão modal. A fibra monomodo permite apenas um caminho de propagação."
        },
        {
            text: "Durante a navegação, o piloto seleciona diferentes modos de apresentação no ND. Qual conjunto de informações pode ser apresentado neste visor?",
            options: [
                "Atitude, temperatura dos motores e pressão hidráulica.",
                "VOR, MAP, PLAN e GPWS.",
                "VOR, atitude e parâmetros primários do motor."
            ],
            correctIndex: 1,
            justification: "O Navigation Display (ND) exibe informações de navegação e pode mostrar modos como VOR, MAP, PLAN e alertas de terreno (GPWS). A atitude é mostrada no PFD, e os parâmetros do motor no EICAS/ECAM."
        },
        {
            text: "Uma falha de software pertencente ao nível de criticidade mais elevado pode provocar a perda da capacidade de continuar o voo e aterrar em segurança. Em que categoria se enquadra essa consequência?",
            options: [
                "Catastrófica",
                "Maior",
                "Menor"
            ],
            correctIndex: 0,
            justification: "Falhas que impedem o voo e aterragem seguros são classificadas como Catastróficas (Nível A no DO-178), com probabilidade extremamente improvável (<10⁻⁹ por hora de voo)."
        },
        {
            text: "Numa nova instalação aviónica, substitui-se uma transmissão paralela por uma transmissão série. Qual vantagem pode resultar diretamente desta alteração?",
            options: [
                "Eliminação da necessidade de protocolos de comunicação.",
                "Transmissão obrigatoriamente mais rápida em qualquer aplicação.",
                "Redução da quantidade de cablagem necessária."
            ],
            correctIndex: 2,
            justification: "A transmissão série transmite os bits sequencialmente num único par de fios (ou fibra), reduzindo significativamente a quantidade de cablagem necessária em comparação com a transmissão paralela, que requer um fio por bit."
        },
        {
            text: "Ao representar o número decimal 174 no sistema hexadecimal, qual é o resultado?",
            options: [
                "AE",
                "FA",
                "9C"
            ],
            correctIndex: 0,
            justification: "O número decimal 174 dividido por 16 resulta em 10 (que é 'A' em hexadecimal) com resto 14 (que é 'E' em hexadecimal). Portanto, 174₁₀ = AE₁₆."
        }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let userJustification = new Array(total).fill(null);

    const mainWrapper = document.getElementById('mainWrapper');
    const capaScreen = document.getElementById('capaScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const blankScreen = document.getElementById('blankScreen');
    const questionText = document.getElementById('questionText');
    const optionsArea = document.getElementById('optionsArea');
    const feedbackArea = document.getElementById('feedbackArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const startQuizBtn = document.getElementById('startQuizBtn');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const endQuizBtn = document.getElementById('endQuizBtn');
    const resultContent = document.getElementById('resultContent');
    
    // Controlos de acessibilidade
    const fontMinus = document.getElementById('fontMinus');
    const fontPlus = document.getElementById('fontPlus');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    
    let baseFontSize = 16; // Tamanho base para referência

    fontMinus.addEventListener('click', () => {
        baseFontSize = Math.max(12, baseFontSize - 2);
        applyFontSize(baseFontSize);
    });

    fontPlus.addEventListener('click', () => {
        baseFontSize = Math.min(30, baseFontSize + 2);
        applyFontSize(baseFontSize);
    });

    function applyFontSize(size) {
        // Aplica aos elementos internos
        const questionText = document.getElementById('questionText');
        const optBtns = document.querySelectorAll('.opt-btn');
        const feedback = document.getElementById('feedbackArea');
        
        questionText.style.fontSize = (size * 1.875) + 'px'; // 30px base para 16
        optBtns.forEach(btn => btn.style.fontSize = (size * 1.375) + 'px'); // 22px base para 16
        if(feedback) feedback.style.fontSize = (size * 1.125) + 'px'; // 18px base para 16
    }

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log(`Erro ao tentar entrar em tela cheia: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    });

    function renderQuestion() {
        const q = questions[currentIndex];
        
        questionText.innerHTML = `<strong>Questão ${currentIndex + 1}:</strong> ${q.text}`;
        
        optionsArea.innerHTML = q.options.map((opt, idx) => 
            `<button class="opt-btn" data-index="${idx}">${opt}</button>`
        ).join('');

        feedbackArea.style.display = 'none';
        feedbackArea.className = 'feedback';
        
        const selected = userAnswers[currentIndex];
        const btns = document.querySelectorAll('.opt-btn');
        
        if (selected !== null) {
            btns.forEach(btn => {
                if (parseInt(btn.getAttribute('data-index')) === selected) {
                    btn.classList.add('selected');
                }
            });
            
            if (userJustification[currentIndex]) {
                const isCorrect = (selected === questions[currentIndex].correctIndex);
                feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
                feedbackArea.style.display = 'block';
                feedbackArea.innerHTML = userJustification[currentIndex];
            }
        }
        
        progressText.innerText = `Questão ${currentIndex + 1} de ${total}`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
        
        // Reaplica o tamanho da fonte após renderizar
        applyFontSize(baseFontSize);
    }

    function selectAnswer(index) {
        userAnswers[currentIndex] = index;
        const q = questions[currentIndex];
        const isCorrect = (index === q.correctIndex);
        const correctText = q.options[q.correctIndex];
        
        const explanation = 
            `<strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>
             <strong>Justificativa:</strong> ${q.justification}<br>
             <span style="font-size:0.85em; opacity:0.8; margin-top:5px; display:block;">Resposta correta: ${correctText}</span>`;
             
        userJustification[currentIndex] = explanation;
        
        feedbackArea.classList.remove('correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.style.display = 'block';
        feedbackArea.innerHTML = explanation;
        
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(btn => btn.classList.remove('selected'));
        
        const selectedBtn = Array.from(btns).find(btn => parseInt(btn.getAttribute('data-index')) === index);
        if (selectedBtn) selectedBtn.classList.add('selected');
        
        applyFontSize(baseFontSize); // Reaplica fonte no feedback
    }

    optionsArea.addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (btn) selectAnswer(parseInt(btn.getAttribute('data-index')));
    });

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) {
            alert('Por favor, responda a questão antes de avançar.');
            return;
        }
        if (currentIndex < total - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            mostrarResultado();
        }
    });

    function mostrarResultado() {
        let acertos = 0;
        let erros = 0;
        for (let i = 0; i < total; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === questions[i].correctIndex) acertos++;
            else if (userAnswers[i] !== null) erros++;
        }
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;

        let mensagem = "";
        if (percentual >= 85) mensagem = "⭐ Excelente! Você domina os conceitos de eletrónica digital e sistemas de aeronaves.";
        else if (percentual >= 70) mensagem = "👍 Muito bom! Revise os pontos que errou e tente novamente.";
        else if (percentual >= 50) mensagem = "📘 Bom, mas dá para melhorar. Releia as justificativas das questões que errou.";
        else mensagem = "📚 Que tal revisar o conteúdo com calma e depois refazer o quiz?";

        const resultadoHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} (${percentual.toFixed(1)}%)</p>
                <p><strong>❌ Erros:</strong> ${erros}</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #e2e8f0;">
                <p>${mensagem}</p>
            </div>
        `;
        resultContent.innerHTML = resultadoHTML;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    function mostrarBlank() {
        capaScreen.classList.remove('active');
        quizScreen.classList.remove('active');
        resultScreen.classList.remove('active');
        blankScreen.classList.remove('active');
        blankScreen.classList.add('active');
        mainWrapper.classList.add('wrapper-blank');
        blankScreen.innerHTML = '';
    }

    function refazerQuiz() {
        userAnswers = new Array(total).fill(null);
        userJustification = new Array(total).fill(null);
        currentIndex = 0;
        mainWrapper.classList.remove('wrapper-blank');
        blankScreen.classList.remove('active');
        resultScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    }

    startQuizBtn.addEventListener('click', () => {
        capaScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });

    restartQuizBtn.addEventListener('click', refazerQuiz);
    endQuizBtn.addEventListener('click', mostrarBlank);
</script>
</body>
</html>
