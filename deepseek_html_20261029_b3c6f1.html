                Computer Structure · Microprocessors · Advanced Logic Circuits · Multiplexing</h2>

            </div>`,

            // Page 2 – Index
            `<div class="text-container" style="max-width:100%;">
                <h3>📌 PART 3 INDEX</h3>
                <ol>
                    <li>Basic Computer Structure – Page 3</li>
                    <li>Buses and Memory – Page 4</li>

                    <li>Practice Exercises (12 Questions) – Page 14</li>
                    <li>Continuing Exercises / Summary – Page 15</li>
                    <li>🎉 Congratulations (End of Part 3) – Page 16</li>
                </ol>
            </div>`,

            // Page 3
            `<h3>1. Basic Computer Structure</h3>
            <p>A computer is composed of hardware (physical components) and software (programs). The basic architecture of a microcomputer is divided into four main functional units.</p>
            
            <h4>1.1 The Four Functional Units</h4>
            <ul>
                <li><strong>Input Unit:</strong> Receives data from the outside world (keyboard, sensors, etc.).</li>
                <li><strong>Memory Unit:</strong> Stores instructions and data.</li>
                <li><strong>Central Processing Unit (CPU):</strong> The "brain" that processes data and controls operations.</li>
                <li><strong>Output Unit:</strong> Sends results to the outside world (screens, actuators, etc.).</li>
            </ul>

            <h4>1.2 The CPU (Central Processing Unit)</h4>
            <p>The CPU is composed of two main parts:</p>
            <ul>
                <li><strong>ALU (Arithmetic Logic Unit):</strong> Performs arithmetic (addition, subtraction) and logic (AND, OR, NOT) operations.</li>
                <li><strong>Control Unit:</strong> Coordinates all operations, decoding instructions and generating control signals.</li>
            </ul>
            <p>Data is temporarily stored in <strong>registers</strong> within the CPU.</p>`,

            // Page 4
            `<h3>2. Buses and Memory</h3>
            
            <h4>2.1 Buses</h4>
            <p>Buses are the "pathways" through which information flows between the computer's components:</p>
            <ul>
                <li><strong>Address Bus:</strong> Unidirectional. Indicates the memory location or device that the CPU wishes to access.</li>
                <li><strong>Data Bus:</strong> Bidirectional. Carries data and instructions between the CPU and memory.</li>
                <li><strong>Control Bus:</strong> Carries timing, read, write, and interrupt signals.</li>
            </ul>

            <h4>2.2 Memory: Primary vs Secondary</h4>
            <ul>
                <li><strong>Primary Memory (RAM/ROM):</strong> Fast access, volatile (RAM) or non-volatile (ROM). This is where the computer actively works.</li>
                <li><strong>Secondary Memory (Disks, Tapes):</strong> Permanent storage, slower, used to save data long-term.</li>
            </ul>

            <h4>2.3 Volatile vs Non-Volatile</h4>
            <ul>
                <li><strong>Volatile:</strong> Loses data when power is cut (e.g., RAM).</li>
                <li><strong>Non-Volatile:</strong> Retains data without power (e.g., ROM, Flash, hard drive).</li>
            </ul>`,

            // Page 5
            `<h3>3. Memory Types</h3>
            
            <h4>3.1 RAM (Random Access Memory)</h4>
            <ul>
                <li>Read and write.</li>
                <li>Volatile (loses data without power).</li>
                <li>Types: <strong>SRAM</strong> (faster, uses flip-flops) and <strong>DRAM</strong> (slower, uses capacitors, requires refresh).</li>
            </ul>

            <h4>3.2 ROM (Read-Only Memory)</h4>
            <ul>
                <li>Read-only.</li>
                <li>Non-volatile.</li>
                <li>Contains essential firmware (e.g., BIOS).</li>
            </ul>

            <h4>3.3 PROM (Programmable ROM)</h4>
            <ul>
                <li>Can be programmed once by the user.</li>
                <li>Programming is done by "burning" internal fuses.</li>
            </ul>

            <h4>3.4 EPROM and EEPROM</h4>
            <ul>
                <li><strong>EPROM:</strong> Can be erased by exposing the chip to ultraviolet light. Requires removal from the circuit.</li>
                <li><strong>EEPROM:</strong> Electrically erasable, without removal. It is the basis of Flash memory.</li>
            </ul>`,

            // Page 6
            `<h3>4. Microprocessors: Operation and Elements</h3>
            <p>A microprocessor is a chip that integrates all the functions of a CPU. It is a programmable device that accepts digital data, processes it according to stored instructions, and provides results.</p>
            
            <h4>4.1 Elements of the Microprocessor</h4>
            <ul>
                <li><strong>Control Unit:</strong> Manages the execution of instructions.</li>
                <li><strong>ALU:</strong> Performs mathematical and logical operations.</li>
                <li><strong>Registers:</strong> High-speed temporary storage (Accumulator, Program Counter, Status Register).</li>
                <li><strong>Clock:</strong> Generates the timing pulses that synchronize all operations.</li>
            </ul>

            <h4>4.2 Register Functions</h4>
            <ul>
                <li><strong>Accumulator:</strong> Stores intermediate results of ALU operations.</li>
                <li><strong>Program Counter (PC):</strong> Holds the address of the next instruction to be executed.</li>
                <li><strong>Status Register (Flags):</strong> Indicates conditions such as zero, carry, overflow.</li>
            </ul>`,

            // Page 7
            `<h3>5. The Fetch-Decode-Execute Cycle and the Clock</h3>
            
            <h4>5.1 The Instruction Cycle</h4>
            <p>The CPU executes instructions in a continuous three-step cycle:</p>
            <ol>
                <li><strong>Fetch:</strong> The CPU reads the next instruction from memory into the instruction register.</li>
                <li><strong>Decode:</strong> The control unit interprets the instruction to know what to do.</li>
                <li><strong>Execute:</strong> The ALU or another unit performs the requested operation.</li>
            </ol>

            <h4>5.2 The Clock</h4>
            <ul>
                <li>Processor speed is measured in <strong>Hertz (Hz)</strong>, typically MHz or GHz.</li>
                <li>A 3 GHz clock means 3 billion cycles per second.</li>
                <li>The higher the clock frequency, the more instructions the CPU can execute per second (assuming the architecture allows it).</li>
            </ul>`,

            // Page 8
            `<h3>6. Integrated Circuits: Adders</h3>
            <p>Adders are combinational logic circuits that perform the addition of binary numbers.</p>
            
            <h4>6.1 Half Adder</h4>
            <ul>
                <li>Adds two bits (A and B).</li>
                <li>Produces a sum (S) and a carry-out (C).</li>
                <li>Does not accept a carry-in from a previous operation.</li>
                <li>Implemented with an XOR gate (for the sum) and an AND gate (for the carry).</li>
            </ul>

            <h4>6.2 Full Adder</h4>
            <ul>
                <li>Adds two bits (A and B) and a carry-in (Cin).</li>
                <li>Produces a sum (S) and a carry-out (Cout).</li>
                <li>It is the basis for adding multi-bit numbers (cascaded adders).</li>
                <li>Can be constructed with two half adders and an OR gate.</li>
            </ul>

            <h4>6.3 Subtraction</h4>
            <p>Subtraction is performed using the two's complement and an adder. The adder/subtractor circuit uses XOR gates to invert the bits and add 1 (via carry-in) when the subtraction mode is selected.</p>`,

            // Page 9
            `<h3>7. Flip-Flops (RS, D, JK)</h3>
            <p>Flip-flops are bistable devices (1-bit memory) used in sequential circuits. They have two complementary outputs: Q and Q'.</p>
            
            <h4>7.1 RS Flip-Flop</h4>
            <ul>
                <li><strong>S (Set):</strong> Sets Q=1.</li>
                <li><strong>R (Reset):</strong> Sets Q=0.</li>
                <li>When both are inactive, the flip-flop "remembers" the last state.</li>
                <li>Invalid state if S=1 and R=1 (in the basic NOR version).</li>
            </ul>

            <h4>7.2 D Flip-Flop (Data)</h4>
            <ul>
                <li>Has a data input (D) and a clock (CLK).</li>
                <li>The output Q assumes the value of D at the clock transition.</li>
                <li>Used for storage and registers.</li>
            </ul>

            <h4>7.3 JK Flip-Flop</h4>
            <ul>
                <li>Improved version of the RS. Eliminates the invalid state.</li>
                <li>When J=1 and K=1, the flip-flop <strong>toggles</strong> at each clock pulse.</li>
                <li>Can be configured as RS, D, or T (Toggle).</li>
            </ul>`,

            // Page 10
            `<h3>8. Counters and Shift Registers</h3>
            
            <h4>8.1 Counters</h4>
            <ul>
                <li><strong>Asynchronous (Ripple):</strong> The clock is applied to the first flip-flop, and its output feeds the clock of the next. They suffer from propagation delay.</li>
                <li><strong>Synchronous:</strong> The clock is applied simultaneously to all flip-flops. Faster and more accurate.</li>
                <li><strong>Decade Counter:</strong> Counts from 0 to 9 and resets (modulo 10).</li>
            </ul>

            <h4>8.2 Shift Registers</h4>
            <ul>
                <li>Store and move data bit by bit.</li>
                <li><strong>SISO (Serial-In, Serial-Out):</strong> Serial input and output.</li>
                <li><strong>SIPO (Serial-In, Parallel-Out):</strong> Serial input, parallel output (serial-to-parallel conversion).</li>
                <li><strong>PISO (Parallel-In, Serial-Out):</strong> Parallel input, serial output (parallel-to-serial conversion).</li>
                <li><strong>Left Shift:</strong> Multiplies by 2. <strong>Right Shift:</strong> Divides by 2.</li>
            </ul>`,

            // Page 11
            `<h3>9. Encoders and Decoders</h3>
            
            <h4>9.1 Decoder</h4>
            <ul>
                <li>Converts an <em>n</em>-bit binary code into one of 2ⁿ outputs.</li>
                <li>Example: A 3-to-8 line decoder receives 3 bits and activates one of 8 outputs.</li>
                <li>Used to select memory chips or 7-segment displays.</li>
            </ul>

            <h4>9.2 Encoder</h4>
            <ul>
                <li>Inverse function: receives an active input and generates the corresponding binary code.</li>
                <li>Example: Calculator keyboard, where the pressed key generates the corresponding BCD code.</li>
                <li><strong>Priority:</strong> If multiple inputs are active, it produces the code of the highest-priority input.</li>
            </ul>`,

            // Page 12
            `<h3>10. Multiplexing: FDM and TDM</h3>
            <p>Multiplexing is the technique of transmitting multiple signals over a single transmission medium (cable or fiber), reducing costs and weight.</p>
            
            <h4>10.1 FDM (Frequency Division Multiplexing)</h4>
            <ul>
                <li>Each signal occupies a different frequency band.</li>
                <li>Signals are transmitted simultaneously, but at different frequencies.</li>
                <li>Used in radio and analog TV transmissions.</li>
            </ul>

            <h4>10.2 TDM (Time Division Multiplexing)</h4>
            <ul>
                <li>Total time is divided into small intervals (time slots).</li>
                <li>Each signal uses the full channel, but only in its time slot.</li>
                <li>Signals are transmitted sequentially, one after the other.</li>
                <li>It is the most common method in digital communications and fiber optics.</li>
            </ul>`,

            // Page 13
            `<h3>11. Multiplexers (MUX) and Demultiplexers (DEMUX)</h3>
            
            <h4>11.1 MUX (Multiplexer)</h4>
            <ul>
                <li>Selects one of several inputs and connects it to a single output.</li>
                <li>Requires <em>n</em> select lines for <strong>2ⁿ</strong> inputs.</li>
                <li>Example: An 8-input MUX requires 3 select lines.</li>
                <li>It is like an electronic "rotary switch".</li>
            </ul>

            <h4>11.2 DEMUX (Demultiplexer)</h4>
            <ul>
                <li>Inverse function: takes a single input and routes it to one of several outputs.</li>
                <li>Used at the receiver to separate the multiplexed signals.</li>
                <li>Also requires <em>n</em> select lines for <strong>2ⁿ</strong> outputs.</li>
            </ul>

            <h4>11.3 Applications in Aircraft</h4>
            <ul>

        function tokenizeTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }
            textNodes.forEach(node => {
                const text = node.textContent;
                if (!text.trim()) return;
                if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;
                const fragment = document.createDocumentFragment();
                const parts = text.split(/(\s+)/);
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'speech-word';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });

                if (idx < spans.length - 1) map.push(idx);

                synth.resume();
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
            } else {
                startSelectionReading();
            }
        }

        function stopSelectionReading() {
            if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
            resetSelectionState();
        }

        function resetSelectionState() {
            if (selectionUtterance) {
                selectionUtterance.onboundary = null;
                selectionUtterance.onstart = null;
                selectionUtterance.onend = null;
                selectionUtterance.onerror = null;
                selectionUtterance = null;
            }
            isReadingSelection = false;
            isSelectionPaused = false;
            selectionToken = null;
            clearSelectionHighlights();
            setSelectionBtnState('idle');
            stopBtn.classList.add('hidden');
        }

        function updateUI() {
            resetSpeechState();
            resetSelectionState();
            pageContent.innerHTML = pageContents[currentPage];
            tokenizeTextNodes(pageContent);
            lastSelectionRange = null;
            lastSelectionText = '';

            const num = currentPage + 1;
            pageXofY.textContent = `Page ${num} of ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);

            if (currentPage === totalPages - 1) {
                encerrarBtn.classList.remove('hidden');
            } else {
                encerrarBtn.classList.add('hidden');
            }

            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
