            <p>ACARS (Aircraft Communications Addressing and Reporting System) is a digital datalink system for transmitting short messages between the aircraft and ground stations via VHF radio or satellite (SATCOM).</p>
            
            <h4>1.1 Main Functions</h4>

                <li><strong>Upper DU:</strong> Permanently displays primary engine parameters (N1, EGT, EPR) and alert messages (warnings, cautions, advisories).</li>

            <h4>2.3 Redundancy</h4>
            <p>The system has two dedicated computers (left and right). One is active and the other is on standby (hot backup), assuming control automatically in case of failure.</p>`,

            // Page 5
            `<h3>3. FBW (Fly-by-Wire)</h3>
            <p>Fly-by-Wire replaces mechanical cables and hydraulic flight control systems with electrical signals and computers. The pilot moves the sidestick or column, and the computers interpret the signal, moving the control surfaces.</p>
            
            <h4>3.1 Advantages</h4>
            <ul>
                <li>Reduction in weight and complexity (fewer cables and pulleys).</li>
                <li><strong>Flight Envelope Protection:</strong> Computers prevent the pilot from exceeding speed limits, angle of attack (stall), or load factor (G).</li>
                <li>Uniform handling between different aircraft models of the same family.</li>
            </ul>

            <h4>3.2 Architecture (Airbus A320 as an example)</h4>
            <ul>
                <li>Control computers: 2 ELACs (Elevator Aileron Computer), 3 SECs (Spoilers Elevator Computer), and 2 FACs (Flight Augmentation Computer).</li>
                <li><strong>Redundancy:</strong> The architecture is quadruplex (4 independent channels) to ensure that no single failure causes loss of control.</li>
                <li><strong>Direct Mode:</strong> If the computers fail, the system degrades to direct mode, where pilot inputs go directly to the actuators, without envelope protections.</li>
            </ul>`,

        function tokenizeTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];

                textNodes.push(walker.currentNode);
            }
            textNodes.forEach(node => {
                const text = node.textContent;
                if (!text.trim()) return;
                if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;

                const parts = text.split(/(\s+)/);

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
