<script>
    (function(){
        const pageContents = [
            // Página 1 – Capa
            `<div class="capa">
                <h1>📘 Módulo 5B2 · Parte 3</h1>
                <h2>Computadores, Circuitos Integrados e Multiplexação<br>
                Estrutura de Computadores · Microprocessadores · Circuitos Lógicos Avançados · Multiplexação</h2>
                <p>Material de Estudo Resumido</p>
            </div>`,

            // Página 2 – Índice
            `<div class="text-container" style="max-width:100%;">
                <h3>📌 ÍNDICE DA PARTE 3</h3>
                <ol>
                    <li>Estrutura Básica de um Computador – Pág. 3</li>
                    <li>Barramentos (Buses) e Memória – Pág. 4</li>
                    <li>Tipos de Memória: RAM, ROM e PROM – Pág. 5</li>
                    <li>Microprocessadores: Operação e Elementos – Pág. 6</li>
                    <li>O Ciclo Fetch-Decode-Execute e o Clock – Pág. 7</li>
                    <li>Circuitos Integrados: Somadores (Adders) – Pág. 8</li>
                    <li>Flip-Flops (RS, D, JK) – Pág. 9</li>
                    <li>Contadores e Registradores de Deslocamento – Pág. 10</li>
                    <li>Codificadores e Descodificadores – Pág. 11</li>
                    <li>Multiplexação: FDM e TDM – Pág. 12</li>
                    <li>Multiplexadores (MUX) e Demultiplexadores (DEMUX) – Pág. 13</li>
                    <li>Exercícios de Fixação (12 Questões com Respostas) – Pág. 14</li>
                    <li>Continuação dos Exercícios – Pág. 15</li>
                    <li>🎉 Parabéns (Fim da Parte 3) – Pág. 16</li>
                </ol>
            </div>`,

            // Página 3
            `<h3>1. Estrutura Básica de um Computador</h3>
            <p>Um computador é composto por hardware (componentes físicos) e software (programas). A arquitetura básica de um microcomputador é dividida em quatro unidades funcionais principais.</p>
            
            <h4>1.1 As Quatro Unidades Funcionais</h4>
            <ul>
                <li><strong>Unidade de Entrada (Input Unit):</strong> Recebe dados do mundo exterior (teclado, sensores, etc.).</li>
                <li><strong>Unidade de Memória (Memory Unit):</strong> Armazena instruções e dados.</li>
                <li><strong>Unidade Central de Processamento (CPU):</strong> O "cérebro" que processa dados e controla operações.</li>
                <li><strong>Unidade de Saída (Output Unit):</strong> Envia resultados para o mundo exterior (ecrãs, atuadores, etc.).</li>
            </ul>

            <h4>1.2 A CPU (Central Processing Unit)</h4>
            <p>A CPU é composta por duas partes principais:</p>
            <ul>
                <li><strong>ALU (Arithmetic Logic Unit):</strong> Realiza operações aritméticas (soma, subtração) e lógicas (AND, OR, NOT).</li>
                <li><strong>Unidade de Controlo (Control Unit):</strong> Coordena todas as operações, descodificando instruções e gerando sinais de controlo.</li>
            </ul>
            <p>Os dados são armazenados temporariamente em <strong>registadores</strong> dentro da CPU.</p>`,

            // Página 4
            `<h3>2. Barramentos (Buses) e Memória</h3>
            
            <h4>2.1 Barramentos</h4>
            <p>Os barramentos são os "caminhos" por onde a informação flui entre os componentes do computador:</p>
            <ul>
                <li><strong>Barramento de Endereços (Address Bus):</strong> Unidirecional. Indica a localização da memória ou dispositivo que o CPU deseja aceder.</li>
                <li><strong>Barramento de Dados (Data Bus):</strong> Bidirecional. Transporta os dados e instruções entre a CPU e a memória.</li>
                <li><strong>Barramento de Controlo (Control Bus):</strong> Transporta sinais de temporização, leitura, escrita e interrupções.</li>
            </ul>

            <h4>2.2 Memória: Primária vs Secundária</h4>
            <ul>
                <li><strong>Memória Primária (RAM/ROM):</strong> Acesso rápido, volátil (RAM) ou não volátil (ROM). É onde o computador trabalha ativamente.</li>
                <li><strong>Memória Secundária (Discos, Fitas):</strong> Armazenamento permanente, mais lento, usado para guardar dados a longo prazo.</li>
            </ul>

            <h4>2.3 Volátil vs Não Volátil</h4>
            <ul>
                <li><strong>Volátil:</strong> Perde os dados quando a energia é cortada (ex: RAM).</li>
                <li><strong>Não Volátil:</strong> Mantém os dados sem energia (ex: ROM, Flash, disco rígido).</li>
            </ul>`,

            // Página 5
            `<h3>3. Tipos de Memória</h3>
            
            <h4>3.1 RAM (Random Access Memory)</h4>
            <ul>
                <li>Leitura e escrita.</li>
                <li>Volátil (perde dados sem energia).</li>
                <li>Tipos: <strong>SRAM</strong> (mais rápida, usa flip-flops) e <strong>DRAM</strong> (mais lenta, usa condensadores, necessita refresh).</li>
            </ul>

            <h4>3.2 ROM (Read-Only Memory)</h4>
            <ul>
                <li>Apenas leitura.</li>
                <li>Não volátil.</li>
                <li>Contém o firmware essencial (ex: BIOS).</li>
            </ul>

            <h4>3.3 PROM (Programmable ROM)</h4>
            <ul>
                <li>Pode ser programada uma única vez pelo utilizador.</li>
                <li>A programação é feita pelo "queimar" de fusíveis internos.</li>
            </ul>

            <h4>3.4 EPROM e EEPROM</h4>
            <ul>
                <li><strong>EPROM:</strong> Pode ser apagada expondo o chip a luz ultravioleta. Requer remoção do circuito.</li>
                <li><strong>EEPROM:</strong> Apagada eletricamente, sem remoção. É a base da memória Flash.</li>
            </ul>`,

            // Página 6
            `<h3>4. Microprocessadores: Operação e Elementos</h3>
            <p>Um microprocessador é um chip que integra todas as funções da CPU. É um dispositivo programável que aceita dados digitais, processa-os segundo instruções armazenadas e fornece resultados.</p>
            
            <h4>4.1 Elementos do Microprocessador</h4>
            <ul>
                <li><strong>Unidade de Controlo:</strong> Gere a execução das instruções.</li>
                <li><strong>ALU:</strong> Executa operações matemáticas e lógicas.</li>
                <li><strong>Registadores:</strong> Armazenamento temporário de alta velocidade (Acumulador, Program Counter, Status Register).</li>
                <li><strong>Clock:</strong> Gera os pulsos de temporização que sincronizam todas as operações.</li>
            </ul>

            <h4>4.2 Função dos Registadores</h4>
            <ul>
                <li><strong>Acumulador:</strong> Armazena resultados intermédios de operações da ALU.</li>
                <li><strong>Program Counter (PC):</strong> Contém o endereço da próxima instrução a ser executada.</li>
                <li><strong>Status Register (Flags):</strong> Indica condições como zero, carry, overflow.</li>
            </ul>`,

            // Página 7
            `<h3>5. O Ciclo Fetch-Decode-Execute e o Clock</h3>
            
            <h4>5.1 O Ciclo de Instrução</h4>
            <p>A CPU executa instruções num ciclo contínuo de três etapas:</p>
            <ol>
                <li><strong>Fetch (Buscar):</strong> A CPU lê a próxima instrução da memória para o registador de instruções.</li>
                <li><strong>Decode (Descodificar):</strong> A unidade de controlo interpreta a instrução para saber o que fazer.</li>
                <li><strong>Execute (Executar):</strong> A ALU ou outra unidade realiza a operação solicitada.</li>
            </ol>

            <h4>5.2 O Clock (Relógio)</h4>
            <ul>
                <li>A velocidade do processador é medida em <strong>Hertz (Hz)</strong>, geralmente MHz ou GHz.</li>
                <li>Um clock de 3 GHz significa 3 mil milhões de ciclos por segundo.</li>
                <li>Quanto maior a frequência do clock, mais instruções a CPU pode executar por segundo (assumindo que a arquitetura o permita).</li>
            </ul>`,

            // Página 8
            `<h3>6. Circuitos Integrados: Somadores (Adders)</h3>
            <p>Os somadores são circuitos lógicos combinacionais que realizam a adição de números binários.</p>
            
            <h4>6.1 Meio Somador (Half Adder)</h4>
            <ul>
                <li>Soma dois bits (A e B).</li>
                <li>Produz uma soma (S) e um carry-out (C).</li>
                <li>Não aceita carry-in de uma operação anterior.</li>
                <li>Implementado com uma porta XOR (para a soma) e uma AND (para o carry).</li>
            </ul>

            <h4>6.2 Somador Completo (Full Adder)</h4>
            <ul>
                <li>Soma dois bits (A e B) e um carry-in (Cin).</li>
                <li>Produz uma soma (S) e um carry-out (Cout).</li>
                <li>É a base para somar números de múltiplos bits (somadores em cascata).</li>
                <li>Pode ser construído com dois meios somadores e uma porta OR.</li>
            </ul>

            <h4>6.3 Subtração</h4>
            <p>A subtração é realizada usando o complemento de 2 e um somador. O circuito somador/subtrator usa portas XOR para inverter os bits e adicionar 1 (via carry-in) quando o modo de subtração é selecionado.</p>`,

            // Página 9
            `<h3>7. Flip-Flops (RS, D, JK)</h3>
            <p>Os flip-flops são dispositivos biestáveis (memória de 1 bit) usados em circuitos sequenciais. Têm duas saídas complementares: Q e Q'.</p>
            
            <h4>7.1 RS Flip-Flop</h4>
            <ul>
                <li><strong>S (Set):</strong> Coloca Q=1.</li>
                <li><strong>R (Reset):</strong> Coloca Q=0.</li>
                <li>Quando ambos estão inativos, o flip-flop "lembra" o último estado.</li>
                <li>Estado inválido se S=1 e R=1 (na versão básica com NOR).</li>
            </ul>

            <h4>7.2 D Flip-Flop (Data)</h4>
            <ul>
                <li>Possui uma entrada de dados (D) e um clock (CLK).</li>
                <li>A saída Q assume o valor de D na transição do clock.</li>
                <li>Usado para armazenamento e registadores.</li>
            </ul>

            <h4>7.3 JK Flip-Flop</h4>
            <ul>
                <li>Versão melhorada do RS. Elimina o estado inválido.</li>
                <li>Quando J=1 e K=1, o flip-flop <strong>comuta</strong> (toggle) a cada pulso de clock.</li>
                <li>Pode ser configurado como RS, D ou T (Toggle).</li>
            </ul>`,

            // Página 10
            `<h3>8. Contadores e Registradores de Deslocamento</h3>
            
            <h4>8.1 Contadores</h4>
            <ul>
                <li><strong>Assíncronos (Ripple):</strong> O clock é aplicado ao primeiro flip-flop e a saída deste alimenta o clock do próximo. Sofrem de atraso de propagação.</li>
                <li><strong>Síncronos:</strong> O clock é aplicado simultaneamente a todos os flip-flops. Mais rápidos e precisos.</li>
                <li><strong>Contador de Década:</strong> Conta de 0 a 9 e reinicia (módulo 10).</li>
            </ul>

            <h4>8.2 Registradores de Deslocamento (Shift Registers)</h4>
            <ul>
                <li>Armazenam e movem dados bit a bit.</li>
                <li><strong>SISO (Serial-In, Serial-Out):</strong> Entrada e saída em série.</li>
                <li><strong>SIPO (Serial-In, Parallel-Out):</strong> Entrada em série, saída paralela (conversão série-paralelo).</li>
                <li><strong>PISO (Parallel-In, Serial-Out):</strong> Entrada paralela, saída em série (conversão paralelo-série).</li>
                <li><strong>Deslocamento à Esquerda:</strong> Multiplica por 2. <strong>Deslocamento à Direita:</strong> Divide por 2.</li>
            </ul>`,

            // Página 11
            `<h3>9. Codificadores e Descodificadores</h3>

        function tokenizeTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }
            textNodes.forEach(node => {
                const text = node.textContent;
                if (!text.trim()) return;
                if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;
                const fragment = document.createDocumentFragment();
                const parts = text.split(/(\s+)/);
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'speech-word';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

                const len = span.textContent.length;
                for (let i = 0; i < len; i++) map.push(idx);
                if (idx < spans.length - 1) map.push(idx);
            });
            return map;

                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
                return;
            }
            if (isSpeaking) { stopReading(); return; }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
            }
            buildCharMap();
            if (wordSpans.length === 0) return;

            const text = wordSpans.map(s => s.textContent).join(' ');
            currentUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) currentUtterance.voice = voice;
            currentUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            speechToken = token;
            currentCharIndex = 0;

            currentUtterance.onboundary = function(event) {
                if (speechToken !== token) return;
                if (event.name === 'word') {
                    currentCharIndex = event.charIndex;
                    syncHighlightFromCharIndex();
                }
            };
            currentUtterance.onstart = function() {
                if (speechToken !== token) return;
                isSpeaking = true;
                isPaused = false;
                showPlayingUI();
            };
            currentUtterance.onend = function() {
                if (speechToken !== token) return;
                resetSpeechState();
            };
            currentUtterance.onerror = function(e) {
                if (speechToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Speech error:', e.error);
                resetSpeechState();
            };

            synth.speak(currentUtterance);
        }

        function pauseReading() {
            if (synth && isSpeaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showPausedUI();
            }
        }

        function resumeReading() {
            if (synth && isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
            }
        }

        function stopReading() {
            if (synth) synth.cancel();
            resetSpeechState();
        }

        function resetSpeechState() {
            if (synth && synth.speaking) synth.cancel();
            if (currentUtterance) {
                currentUtterance.onboundary = null;
                currentUtterance.onstart = null;
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance = null;
            }
            isSpeaking = false;
            isPaused = false;
            speechToken = null;
            currentCharIndex = 0;
            clearAllWordHighlights();
            showStoppedUI();
        }

        function startSelectionReading() {
            if (!synth) { alert('Seu navegador não suporta síntese de voz.'); return; }
            if (isSpeaking || isPaused) stopReading();

            const range = getActiveSelectionRange();
            if (!range) {
                alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
                return;
            }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
                const newRange = getActiveSelectionRange();
                if (!newRange) {
                    alert('Selecione novamente o trecho desejado.');
                    return;
                }
                return startSelectionReadingWithRange(newRange);
            }

            startSelectionReadingWithRange(range);
        }

        function startSelectionReadingWithRange(range) {
            const spans = [];
            pageContent.querySelectorAll('.speech-word').forEach(span => {
                try {
                    if (range.intersectsNode(span)) spans.push(span);
                } catch(e) {}
            });

            if (spans.length === 0) {
                alert('Nenhum texto selecionado. Selecione um trecho e clique em "Ler Seleção".');
                return;
            }

            selectionWordSpans = spans;
            selectionCharMap = buildCharMapForSpans(selectionWordSpans);
            clearSelectionHighlights();

            const text = spans.map(s => s.textContent).join(' ');
            selectionUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) selectionUtterance.voice = voice;
            selectionUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            selectionToken = token;

            selectionUtterance.onboundary = function(event) {
                if (selectionToken !== token) return;
                if (event.name === 'word') {
                    const charIdx = event.charIndex;
                    if (charIdx < selectionCharMap.length) {
                        const spanIdx = selectionCharMap[charIdx];
                        if (spanIdx !== undefined) highlightSelectionWord(spanIdx);
                    }
                }
            };
            selectionUtterance.onstart = function() {
                if (selectionToken !== token) return;
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
                stopBtn.classList.remove('hidden');
            };
            selectionUtterance.onend = function() {
                if (selectionToken !== token) return;
                resetSelectionState();
            };
            selectionUtterance.onerror = function(e) {
                if (selectionToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Selection speech error:', e.error);
                resetSelectionState();
            };

            synth.speak(selectionUtterance);
        }

        function toggleSelectionReading() {
            if (isReadingSelection) {
                synth.pause();
                isReadingSelection = false;
                isSelectionPaused = true;
                setSelectionBtnState('paused');
            } else if (isSelectionPaused) {
                synth.resume();
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
            } else {
                startSelectionReading();
            }
        }

        function stopSelectionReading() {
            if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
            resetSelectionState();
        }

        function resetSelectionState() {
            if (selectionUtterance) {
                selectionUtterance.onboundary = null;
                selectionUtterance.onstart = null;
                selectionUtterance.onend = null;
                selectionUtterance.onerror = null;
                selectionUtterance = null;
            }
            isReadingSelection = false;
            isSelectionPaused = false;
            selectionToken = null;
            clearSelectionHighlights();
            setSelectionBtnState('idle');
            stopBtn.classList.add('hidden');
        }

        function updateUI() {
            resetSpeechState();
            resetSelectionState();
            pageContent.innerHTML = pageContents[currentPage];
            tokenizeTextNodes(pageContent);
            lastSelectionRange = null;
            lastSelectionText = '';

            const num = currentPage + 1;
            pageXofY.textContent = `Página ${num} de ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);

            if (currentPage === totalPages - 1) {
                encerrarBtn.classList.remove('hidden');
            } else {
                encerrarBtn.classList.add('hidden');
            }

            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
