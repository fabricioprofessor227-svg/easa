            // Page 3
            `<h3>1. Introduction to the Electromagnetic Environment</h3>
            <p>Modern aviation depends heavily on electronic systems. However, these systems operate in an environment full of electromagnetic radiation, both generated internally by the aircraft itself and externally by radars, radio stations, and natural phenomena.</p>
            
            <h4>1.1 EMC (Electromagnetic Compatibility)</h4>
            <p>It is the ability of equipment to operate satisfactorily in its electromagnetic environment, without introducing intolerable disturbances to other devices in that same environment.</p>
            <ul>
                <li>EMC tests evaluate <strong>emissions</strong> (how much the equipment "pollutes" the environment) and <strong>immunity</strong> (how much it resists external pollution).</li>
                <li>Tests are carried out in anechoic or reverberating chambers.</li>
            </ul>

            <h4>1.2 EMI (Electromagnetic Interference)</h4>
            <p>It is the unwanted interference caused by electromagnetic radiation. It can manifest as static in audio systems, "snow" on CRT screens, or data loss.</p>
            <p>EMI can be <strong>conducted</strong> (traveling through cables) or <strong>radiated</strong> (traveling through the air).</p>`,

            // Page 4
            `<h3>2. Sources of EMI</h3>
            
            <h4>2.1 Internal Sources</h4>
            <p>They are generated by the aircraft's own equipment:</p>
            <ul>
                <li><strong>Motors and Generators:</strong> Sparks (arcing) between brushes and the commutator generate noise spikes.</li>
                <li><strong>Ignition System:</strong> Magnetos and spark plugs generate high-energy pulses.</li>
                <li><strong>Anti-Collision Lights:</strong> Energy pulses that can induce noise.</li>
                <li><strong>Inverters and Power Supplies:</strong> High-frequency switching generates noise.</li>
            </ul>

            <h4>2.2 External Sources</h4>
            <ul>
                <li><strong>Cosmic Noise:</strong> Radiation from space (most noticeable above 12 MHz).</li>
                <li><strong>Atmospheric Noise:</strong> Electrical discharges during storms.</li>
                <li><strong>Static Electricity (P-Static):</strong> The friction of the aircraft with air particles, rain, or hail accumulates charge on the fuselage. "St. Elmo's Fire" is an example of corona discharge. The <em>static dischargers</em> (wick dischargers) on the wingtips serve to dissipate this charge in a controlled manner.</li>
                <li><strong>External Transmitters:</strong> Radars, radio, and TV stations.</li>
            </ul>`,

            // Page 5
            `<h3>3. HIRF (High Intensity Radiated Fields)</h3>
            <p>HIRF is a high-intensity external (non-ionizing) electromagnetic field that can cause adverse effects on the aircraft's electrical and electronic systems, affecting flight safety.</p>
            
            <h4>3.1 Definition and Frequency Range</h4>
            <ul>
                <li>The spectrum from <strong>10 kHz to 18 GHz</strong> is considered.</li>
                <li>It includes licensed intentional emitters (radars, communications, broadcasting).</li>
                <li>It does not include internally generated EMI (EMC) or electrostatic discharges (ESD).</li>
            </ul>

            <h4>3.2 Spectrum Characteristics</h4>
            <ul>
                <li><strong>Below 400 MHz:</strong> Communication and broadcasting systems predominate (AM/FM radio, TV). The waves are wider and the signals are continuous.</li>
                <li><strong>Above 400 MHz:</strong> Radars, microwave systems, and satellites predominate. The beams are very narrow and the power peaks (pulses) are extremely high.</li>
            </ul>`,

            // Page 6
            `<h3>4. Effects of HIRF on Digital Systems</h3>
            <p>HIRF signals can penetrate the aircraft through windows, the radome (which is transparent to radar), and gaps in the fuselage.</p>

            <h4>4.1 Coupling and Effects</h4>
            <ul>
                <li><strong>Coupling into Cables:</strong> The electromagnetic field induces currents and voltages in the wires. This can lead to voltage spikes that "fool" integrated circuits.</li>
                <li><strong>Effects on Digital Circuits:</strong> HIRF pulses can be rectified by internal diodes, creating a DC offset that changes the logic state (0 to 1 or vice versa), causing "upsets" (momentary failures).</li>
                <li><strong>Effects on Analog Circuits:</strong> They are more sensitive (on the order of 50 mV). They can cause incorrect sensor readings.</li>
                <li><strong>Effects on CRT:</strong> It can cause blurring or momentary screen blackout.</li>
            </ul>

            <h4>4.2 Importance of Shielding</h4>
            <p>The cockpit windows are the main "entry doors" for HIRF, as they are openings in the metallic shielding. The aluminum fuselage offers excellent shielding, but composites require the incorporation of metallic meshes to ensure the same protection.</p>`,

            // Page 7
            `<h3>5. EMI/HIRF Protection Methods</h3>
            
            <h4>5.1 Bonding</h4>
            <p>All equipment, mounting trays, and the aircraft structure must be electrically bonded to ensure a low-impedance path to "ground". The bonding resistance must not exceed 0.05 ohms.</p>

            <h4>5.2 Screening</h4>
            <ul>
                <li>Use of shielded cables (with copper or aluminum braid).</li>
                <li>Cable screens must be grounded, often at only one end, to avoid <strong>ground loops</strong> that act as antennas.</li>
                <li>Conductive gaskets on LRU covers to ensure electrical continuity.</li>
            </ul>

            <h4>5.3 Filters</h4>
            <p>Low-pass filters (capacitors) are placed at the inputs and outputs of LRUs to block high frequencies, allowing the desired low-frequency signals to pass.</p>

            <h4>5.4 Transparent Conductive Windows</h4>
            <p>Cockpit windows can have a thin layer of metal oxide that allows vision but blocks electromagnetic radiation.</p>`,

            `<h3>6. Lightning Protection</h3>
            <p>A commercial aircraft is struck by lightning, on average, once a year. Protection aims to ensure that the discharge passes through the external structure and exits without causing damage to internal systems or igniting fuel.</p>

            <h4>6.1 Strike Zones (SAE ARP 5414)</h4>
            <ul>
                <li><strong>Zone 1:</strong> Areas with a high probability of initial strike (radome, wingtips, nacelles, tail tip).</li>
                <li><strong>Zone 2:</strong> Areas susceptible to being swept (swept stroke) by the lightning channel after the initial strike (mid-fuselage).</li>
                <li><strong>Zone 3:</strong> Areas that rarely receive a direct strike but may conduct current (internal parts, lower structure).</li>
            </ul>

            <h4>6.2 Effects and Damage</h4>
            <ul>
                <li><strong>Metallic Structure:</strong> Holes, burn marks, melting, distortion.</li>
                <li><strong>Composite Structure:</strong> Delamination, fiber burning, puncture. Requires metallic meshes (copper or aluminum foil) and metal strips (diverter strips) on the surface to conduct the current.</li>
                <li><strong>Systems:</strong> Can cause magnetization of components, burning of wires, and damage to LRUs.</li>
            </ul>`,

            `<h3>7. Lightning Inspection and Protection</h3>
            
            <h4>7.1 After a Strike</h4>
            <p>If lightning strikes the aircraft, a special inspection (Lightning Strike Conditional Inspection) must be performed to find the entry and exit points.</p>
            <ul>
                <li>Examine Zone 1 and Zone 2 for burns, holes, and composite damage.</li>
                <li>Check the static dischargers and bonding straps.</li>
                <li>Inspect the antennas and radomes.</li>
                <li>Test the radio, navigation, and radar systems if damage is suspected.</li>
            </ul>

            <h4>7.2 Protection in Composites</h4>
            <ul>
                <li>The Boeing 787 uses a copper or aluminum mesh on the surface of the carbon fiber fuselage to conduct the lightning current.</li>
                <li>The radome has <strong>diverter strips</strong> (metal strips) that act as lightning rods, protecting the radar antenna inside.</li>
            </ul>`,

            // Page 10
            `<h3>8. Introduction to ESD (Electrostatic Discharge)</h3>
            <p>Electrostatic Discharge (ESD) is the sudden transfer of electrical charge between two objects with different potentials. It is one of the main causes of component failure during maintenance.</p>

            <h4>8.1 Triboelectric Effect</h4>
            <p>Static charge is generated when two different materials come into contact and are separated (friction). The human body can accumulate voltages of up to 15,000 volts (when walking on a nylon carpet), which is enough to destroy an integrated circuit.</p>

            <h4>8.2 Device Sensitivity (ESDS)</h4>
            <p>Electronic devices, especially MOSFETs and CMOS circuits, are extremely sensitive. A discharge that is invisible and painless to humans (e.g., 100V) can puncture the silicon oxide of a chip and render it useless.</p>
            <p>The <strong>Triboelectric Series</strong> table shows the tendency of materials to gain or lose electrons. The human body is at the top (tends to become positive) when in contact with nylon.</p>`,

            <p>To classify component sensitivity and test their robustness, standardized models are used.</p>
            
            <h4>9.1 Human Body Model (HBM)</h4>
            <ul>
                <li>The most common. Simulates the discharge of a person touching the component.</li>
                <li>Model: A <strong>100 pF</strong> capacitor (representing the body) discharges through a <strong>1.5 kΩ</strong> resistor (skin resistance).</li>
                <li>It is the oldest model and serves as the basis for many classifications.</li>
            </ul>

            <h4>9.2 Charged Device Model (CDM)</h4>
            <ul>
                <li>Simulates the component moving (e.g., sliding down a feeder) and then coming into contact with a grounded metal surface.</li>
                <li>The device itself is charged and discharges rapidly. It can be more destructive than the HBM.</li>
            </ul>

            <h4>9.3 Machine Model (MM)</h4>
            <ul>
                <li>Simulates the discharge from a metal tool or automated equipment.</li>
                <li>Model: A 200 pF capacitor discharged without a series resistor (very fast, high-current discharge).</li>
            </ul>`,

            `<h3>10. Failure Types and ESD Precautions</h3>
            
            <h4>10.1 Hard Failures vs Soft Failures</h4>
            <ul>
                <li><strong>Hard Failure (Catastrophic Failure):</strong> The component is destroyed immediately. It is easily detected.</li>
                <li><strong>Soft Failure (Latent Failure):</strong> The component is damaged but continues to function. It may fail intermittently days or months later, causing mysterious problems.</li>
            </ul>

            <h4>10.2 Precautions and Protective Equipment</h4>
            <ul>
                <li><strong>Wrist Strap:</strong> Must be worn in contact with bare skin and connected to a ground point. It contains a resistor of <strong>> 1 MΩ</strong> to protect the user from electric shocks.</li>
                <li><strong>Conductive Packaging:</strong> Pink or silver bags (quasi-conductive) for storing PCBs.</li>
                <li><strong>Anti-Static Workstations:</strong> Conductive mats connected to ground and wrist straps.</li>
                <li><strong>Ionizers:</strong> Blow ionized air to neutralize charges in the air.</li>
            </ul>`,

            `<h3>11. Handling Sensitive PCBs and LRUs</h3>
            
            <h4>11.1 Removing PCBs</h4>
            <ol>
                <li>Turn off power and check the AMM (Aircraft Maintenance Manual).</li>
                <li>Connect the anti-static wrist strap to the equipment chassis (not to the floor, to avoid potential differences) and to the wrist.</li>
                <li>Remove the board using the extractors (do not touch the pins or connectors).</li>
                <li>Immediately place it in the conductive bag and seal it (with proper tape or cord, never with staples).</li>
            </ol>

            <h4>11.2 Installing PCBs</h4>
            <ol>
                <li>Check the documentation (JAA Form 1, etc.).</li>
                <li>Connect the wrist strap to the equipment chassis.</li>
                <li>Remove the board from the bag and inspect it (without touching the contacts).</li>
                <li>Insert gently into the slots and lock the extractors.</li>
                <li>Do not touch the connectors with your fingers.</li>
            </ol>

            <h4>11.3 Metallic LRUs</h4>
            <p>When removing/installing a complete LRU (metal box), the wrist strap is not strictly necessary, as the metal casing and aircraft structure act as a safe discharge path. However, protective caps (dust caps) should be used on the connectors.</p>`,

                }

        function getActiveSelectionRange() {

            if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                if (!range.collapsed && range.toString().trim() &&
                    pageContent.contains(range.commonAncestorContainer)) {
                    return range.cloneRange();
                }
            }
            if (lastSelectionRange && lastSelectionText) return lastSelectionRange;
            return null;

        function getFemaleVoice() {
            const voices = synth.getVoices();
            const enVoices = voices.filter(v => v.lang === 'en-US' || v.lang === 'en-GB' || v.lang.startsWith('en'));
            const female = enVoices.find(v =>
                v.name.toLowerCase().includes('female') ||
                v.name.toLowerCase().includes('woman') ||
                v.name.includes('Samantha') ||
                v.name.includes('Zira') ||
                v.name.includes('Jenny') ||
                v.name.includes('Google US English')
            );
            return female || enVoices[0] || voices[0];
        }

        function tokenizeTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }
            textNodes.forEach(node => {
                const text = node.textContent;
                if (!text.trim()) return;
                if (node.parentNode && (node.parentNode.tagName === 'PRE' || node.parentNode.tagName === 'CODE')) return;
                const fragment = document.createDocumentFragment();
                const parts = text.split(/(\s+)/);
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'speech-word';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function buildCharMapForSpans(spans) {
            const map = [];
            spans.forEach((span, idx) => {
                const len = span.textContent.length;
                for (let i = 0; i < len; i++) map.push(idx);
                if (idx < spans.length - 1) map.push(idx);
            });
            return map;
        }

        function buildCharMap() {
            wordSpans = Array.from(pageContent.querySelectorAll('.speech-word'));
            charIndexToSpanMap = buildCharMapForSpans(wordSpans);
        }

        function highlightWordSpan(spanIndex) {
            if (previousActiveSpan !== null) {
                const prevSpan = wordSpans[previousActiveSpan];
                if (prevSpan) {
                    prevSpan.classList.remove('active');
                    prevSpan.classList.remove('upcoming');
                }
            }
            if (spanIndex >= 0 && spanIndex < wordSpans.length) {
                const currentSpan = wordSpans[spanIndex];
                currentSpan.classList.add('active');
                currentSpan.classList.remove('upcoming');
                previousActiveSpan = spanIndex;
                currentSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function markUpcoming(spanIndex) {
            wordSpans.forEach(s => s.classList.remove('upcoming'));
            for (let i = 1; i <= 3; i++) {
                const nextIdx = spanIndex + i;
                if (nextIdx < wordSpans.length) {
                    wordSpans[nextIdx].classList.add('upcoming');
                }
            }
        }

        function clearAllWordHighlights() {
            wordSpans.forEach(s => {
                s.classList.remove('active');
                s.classList.remove('upcoming');
            });
            previousActiveSpan = null;
        }

        function syncHighlightFromCharIndex() {
            if (currentCharIndex >= charIndexToSpanMap.length) return;
            const spanIdx = charIndexToSpanMap[currentCharIndex];
            if (spanIdx !== undefined && spanIdx !== previousActiveSpan) {
                highlightWordSpan(spanIdx);
                markUpcoming(spanIdx);
            }
        }

        function highlightSelectionWord(spanIdx) {
            if (selectionPrevSpan !== null) {
                const prev = selectionWordSpans[selectionPrevSpan];
                if (prev) {
                    prev.classList.remove('active');
                    prev.classList.remove('upcoming');
                }
            }
            if (spanIdx >= 0 && spanIdx < selectionWordSpans.length) {
                const curr = selectionWordSpans[spanIdx];
                curr.classList.add('active');
                curr.classList.remove('upcoming');
                selectionPrevSpan = spanIdx;
                curr.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            selectionWordSpans.forEach((s, i) => {
                if (i !== spanIdx) s.classList.remove('upcoming');
            });
            for (let i = 1; i <= 3; i++) {
                const next = selectionWordSpans[spanIdx + i];
                if (next) next.classList.add('upcoming');
            }
        }

        function clearSelectionHighlights() {
            selectionWordSpans.forEach(s => {
                s.classList.remove('active');
                s.classList.remove('upcoming');
            });
            selectionPrevSpan = null;
        }

        function showPlayingUI() {
            speakBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            stopBtn.classList.remove('hidden');
            resumeBtn.classList.add('hidden');
        }

        function showPausedUI() {
            pauseBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
            resumeBtn.classList.remove('hidden');
            speakBtn.classList.add('hidden');
        }

        function showStoppedUI() {
            speakBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
        }

        function setSelectionBtnState(state) {
            lerSelecaoBtn.classList.remove('reading', 'paused');
            if (state === 'reading') {
                lerSelecaoBtn.textContent = '⏸️ Pause';
                lerSelecaoBtn.title = 'Pause selection reading';
                lerSelecaoBtn.classList.add('reading');
            } else if (state === 'paused') {
                lerSelecaoBtn.textContent = '▶️ Resume';
                lerSelecaoBtn.title = 'Resume selection reading';
                lerSelecaoBtn.classList.add('paused');
            } else {
                lerSelecaoBtn.textContent = '📖 Read Selection';
                lerSelecaoBtn.title = 'Read only the selected text';
            }
        }

        function startReading() {
            if (!synth) { alert('Your browser does not support speech synthesis.'); return; }
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();

            if (isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
                return;
            }
            if (isSpeaking) { stopReading(); return; }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
            }
            buildCharMap();
            if (wordSpans.length === 0) return;

            const text = wordSpans.map(s => s.textContent).join(' ');
            currentUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) currentUtterance.voice = voice;
            currentUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            speechToken = token;
            currentCharIndex = 0;

            currentUtterance.onboundary = function(event) {
                if (speechToken !== token) return;
                if (event.name === 'word') {
                    currentCharIndex = event.charIndex;
                    syncHighlightFromCharIndex();
                }
            };
            currentUtterance.onstart = function() {
                if (speechToken !== token) return;
                isSpeaking = true;

            currentUtterance.onend = function() {
                if (speechToken !== token) return;
                resetSpeechState();
            };
            currentUtterance.onerror = function(e) {
                if (speechToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Speech error:', e.error);
                resetSpeechState();
            };

            synth.speak(currentUtterance);

        function pauseReading() {
            if (synth && isSpeaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showPausedUI();
            }
        }

        function resumeReading() {
            if (synth && isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
            }
        }

        function stopReading() {
            if (synth) synth.cancel();
            resetSpeechState();
        }

        function resetSpeechState() {
            if (synth && synth.speaking) synth.cancel();
            if (currentUtterance) {
                currentUtterance.onboundary = null;
                currentUtterance.onstart = null;
                currentUtterance.onend = null;
                currentUtterance.onerror = null;

            isPaused = false;
            speechToken = null;
            currentCharIndex = 0;
            clearAllWordHighlights();
            showStoppedUI();

        function startSelectionReading() {

                alert('No text selected. Please select a passage and click "Read Selection".');
                return;

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
                const newRange = getActiveSelectionRange();
                if (!newRange) {
                    alert('Please select the desired passage again.');
                    return;
                }
                return startSelectionReadingWithRange(newRange);
            }

            startSelectionReadingWithRange(range);
        }

        function startSelectionReadingWithRange(range) {
            const spans = [];
            pageContent.querySelectorAll('.speech-word').forEach(span => {
                try {
                    if (range.intersectsNode(span)) spans.push(span);
                } catch(e) {}
            });

            if (spans.length === 0) {
                alert('No text selected. Please select a passage and click "Read Selection".');
                return;
            }

            selectionWordSpans = spans;
            selectionCharMap = buildCharMapForSpans(selectionWordSpans);
            clearSelectionHighlights();

            const text = spans.map(s => s.textContent).join(' ');
            selectionUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) selectionUtterance.voice = voice;
            selectionUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            selectionToken = token;

            selectionUtterance.onboundary = function(event) {
                if (selectionToken !== token) return;
                if (event.name === 'word') {
                    const charIdx = event.charIndex;
                    if (charIdx < selectionCharMap.length) {
                        const spanIdx = selectionCharMap[charIdx];
                        if (spanIdx !== undefined) highlightSelectionWord(spanIdx);
                    }
                }
            };
            selectionUtterance.onstart = function() {
                if (selectionToken !== token) return;
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
                stopBtn.classList.remove('hidden');
            };
            selectionUtterance.onend = function() {
                if (selectionToken !== token) return;
                resetSelectionState();
            };
            selectionUtterance.onerror = function(e) {
                if (selectionToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') console.warn('Selection speech error:', e.error);
                resetSelectionState();
            };

            synth.speak(selectionUtterance);
        }

        function toggleSelectionReading() {
            if (isReadingSelection) {
                synth.pause();
                isReadingSelection = false;
                isSelectionPaused = true;
                setSelectionBtnState('paused');
            } else if (isSelectionPaused) {
                synth.resume();
                isReadingSelection = true;
                isSelectionPaused = false;
                setSelectionBtnState('reading');
            } else {
                startSelectionReading();
            }
        }

        function stopSelectionReading() {
            if (synth && (isReadingSelection || isSelectionPaused)) synth.cancel();
            resetSelectionState();
        }

        function resetSelectionState() {
            if (selectionUtterance) {
                selectionUtterance.onboundary = null;
                selectionUtterance.onstart = null;
                selectionUtterance.onend = null;
                selectionUtterance.onerror = null;
                selectionUtterance = null;
            }
            isReadingSelection = false;
            isSelectionPaused = false;
            selectionToken = null;
            clearSelectionHighlights();
            setSelectionBtnState('idle');
            stopBtn.classList.add('hidden');
        }

        function updateUI() {
            resetSpeechState();
            resetSelectionState();
            pageContent.innerHTML = pageContents[currentPage];
            tokenizeTextNodes(pageContent);
            lastSelectionRange = null;
            lastSelectionText = '';

            const num = currentPage + 1;
            pageXofY.textContent = `Page ${num} of ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);

            if (currentPage === totalPages - 1) {
                encerrarBtn.classList.remove('hidden');
            } else {
                encerrarBtn.classList.add('hidden');
            }

            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', () => {
            if (isReadingSelection || isSelectionPaused) stopSelectionReading();
            if (isSpeaking || isPaused) stopReading();
        });

        lerSelecaoBtn.addEventListener('click', toggleSelectionReading);

        rateSelect.addEventListener('change', () => {
            const rate = parseFloat(rateSelect.value);
            if (currentUtterance && isSpeaking && !isPaused) currentUtterance.rate = rate;
            if (selectionUtterance && isReadingSelection && !isSelectionPaused) selectionUtterance.rate = rate;
        });

        encerrarBtn.addEventListener('click', () => {
            if (synth) synth.cancel();
            window.open('about:blank', '_blank');
        });

        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
